<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravações - Professor | SmartClass</title>
    <script src="js/theme-loader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/darkmode-padrao.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#f0f2f5; display:flex; }
        
        .content { margin-left:260px; padding:25px; flex:1; background:#f0f2f5; min-height:100vh; transition: margin-left 0.3s ease; }
        .page-header { margin-bottom:25px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
        .page-header h1 { color:#00796b; font-size:28px; display:flex; align-items:center; gap:12px; }
        .page-header p { color:#666; font-size:14px; }
        
        .stats-video {
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:15px;
            margin-bottom:25px;
        }
        .stat-video-card {
            background:white;
            border-radius:16px;
            padding:16px 18px;
            display:flex;
            align-items:center;
            gap:14px;
            border:1px solid #eef2f6;
            transition:all 0.3s;
        }
        .stat-video-card:hover { transform:translateY(-3px); box-shadow:0 8px 25px rgba(0,121,107,0.08); }
        .stat-video-icon {
            width:44px;
            height:44px;
            background:#e8f5e9;
            border-radius:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            color:#00796b;
            flex-shrink:0;
        }
        .stat-video-info h3 { font-size:22px; font-weight:700; color:#00796b; line-height:1.2; }
        .stat-video-info p { font-size:11px; color:#666; margin-top:2px; }
        
        .tabs-container {
            display:flex;
            gap:10px;
            margin-bottom:25px;
            flex-wrap:wrap;
        }
        .tab-btn {
            padding:10px 24px;
            border:none;
            border-radius:30px;
            cursor:pointer;
            font-size:13px;
            font-weight:600;
            transition:all 0.3s;
            font-family:'Poppins',sans-serif;
            background:#e8e8e8;
            color:#666;
        }
        .tab-btn:hover { transform:translateY(-2px); }
        .tab-btn.active {
            background:#00796b;
            color:white;
            box-shadow:0 4px 15px rgba(0,121,107,0.3);
        }
        .tab-btn .badge {
            background:rgba(0,0,0,0.15);
            padding:2px 10px;
            border-radius:20px;
            font-size:11px;
            margin-left:6px;
        }
        .tab-btn.active .badge { background:rgba(255,255,255,0.25); }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .video-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #eef2f6;
            transition: all 0.3s ease;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,121,107,0.12);
        }
        
        .video-thumb {
            position: relative;
            background: #1a1a2e;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        
        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-thumb .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .video-thumb:hover .play-overlay {
            background: rgba(0,0,0,0.2);
        }
        
        .video-thumb .play-overlay i {
            font-size: 64px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        
        .video-thumb:hover .play-overlay i {
            transform: scale(1.1);
            color: #fbbf24;
        }
        
        .video-thumb .duracao {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.8);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: white;
            font-weight: 600;
        }
        
        .video-thumb .modulo-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,121,107,0.9);
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 11px;
            color: white;
            font-weight: 600;
        }
        
        .video-thumb .status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.liberado { background: #4caf50; color: white; }
        .status-badge.aguardando { background: #f39c12; color: white; }
        
        .video-info { padding: 18px 20px; }
        .video-info h3 { font-size: 17px; color: #2d3436; font-weight:600; margin-bottom:5px; }
        .video-info .meta {
            font-size: 13px;
            color: #888;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .video-info .meta i { color:#00796b; width:18px; }
        
        .video-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #eef2f6;
        }
        
        .btn-acao {
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-liberar {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .btn-liberar:hover { background: #2e7d32; color: white; }
        
        .btn-ocultar {
            background: #ffebee;
            color: #c62828;
        }
        .btn-ocultar:hover { background: #c62828; color: white; }
        
        .btn-excluir {
            background: #f5f5f5;
            color: #666;
        }
        .btn-excluir:hover { background: #c62828; color: white; }
        
        .btn-editar-video {
            background: #e3f2fd;
            color: #1565c0;
        }
        .btn-editar-video:hover { background: #1565c0; color: white; }
        
        .btn-assistir-prof {
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-assistir-prof:hover { transform: translateY(-2px); box-shadow:0 5px 15px rgba(0,121,107,0.3); }
        
        .empty-state {
            text-align:center;
            padding:60px 20px;
            background:white;
            border-radius:20px;
            grid-column:1/-1;
            border:1px solid #eef2f6;
        }
        .empty-state i { font-size:64px; color:#ccc; margin-bottom:15px; }
        .empty-state h3 { color:#636e72; margin-bottom:8px; }
        .empty-state p { color:#b2bec3; font-size:14px; }
        
        /* Modal de edição */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-container {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 24px 24px 0 0;
        }
        .modal-header h3 { color: #00796b; font-size: 20px; }
        .modal-close { font-size: 28px; cursor: pointer; color: #b2bec3; }
        .modal-body { padding: 25px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; color: #2d3436; margin-bottom: 6px; }
        .form-group label i { color: #00796b; margin-right: 6px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background: #f8f9fa;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #00796b;
            box-shadow: 0 0 0 3px rgba(0,121,107,0.1);
        }
        .btn-submit {
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,121,107,0.3); }
        
        /* DARK MODE */
        body.dark-mode .content { background:#0f172a; }
        body.dark-mode .stat-video-card,
        body.dark-mode .video-card,
        body.dark-mode .empty-state,
        body.dark-mode .modal-container,
        body.dark-mode .modal-header { background:#1e293b; border-color:#334155; }
        body.dark-mode .page-header h1,
        body.dark-mode .stat-video-info h3 { color:#fbbf24; }
        body.dark-mode .page-header p,
        body.dark-mode .stat-video-info p,
        body.dark-mode .video-info .meta { color:#94a3b8; }
        body.dark-mode .video-info h3 { color:#f1f5f9; }
        body.dark-mode .stat-video-icon { background:#0d4a47; color:#fbbf24; }
        body.dark-mode .btn-liberar { background:#0d4a47; color:#fbbf24; }
        body.dark-mode .btn-liberar:hover { background:#fbbf24; color:#0f172a; }
        body.dark-mode .btn-ocultar { background:#7f1a1a; color:#fecaca; }
        body.dark-mode .btn-ocultar:hover { background:#fecaca; color:#7f1a1a; }
        body.dark-mode .btn-excluir { background:#334155; color:#94a3b8; }
        body.dark-mode .btn-excluir:hover { background:#7f1a1a; color:#fecaca; }
        body.dark-mode .btn-editar-video { background:#1a3a5c; color:#93c5fd; }
        body.dark-mode .btn-editar-video:hover { background:#93c5fd; color:#0f172a; }
        body.dark-mode .tab-btn { background:#334155; color:#94a3b8; }
        body.dark-mode .tab-btn.active { background:#fbbf24; color:#0f172a; }
        body.dark-mode .btn-assistir-prof { background:linear-gradient(135deg,#0d4a47,#083a38); }
        body.dark-mode .btn-assistir-prof:hover { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#0f172a; }
        body.dark-mode .form-group label { color:#f1f5f9; }
        body.dark-mode .form-group input, body.dark-mode .form-group textarea, body.dark-mode .form-group select {
            background:#334155; border-color:#475569; color:#f1f5f9;
        }
        body.dark-mode .modal-header h3 { color:#fbbf24; }
        
        @media (max-width:768px) {
            .content { margin-left:0; padding:15px; }
            .stats-video { grid-template-columns:repeat(2,1fr); }
            .video-grid { grid-template-columns:1fr; max-width:100%; }
            .page-header { flex-direction:column; align-items:stretch; }
            .tabs-container { justify-content:center; }
        }
        @media (max-width:480px) {
            .stats-video { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-video"></i> Gerenciar Videoaulas</h1>
                <p>Gerencie as gravações e libere para os alunos</p>
            </div>
        </div>

        <!-- ESTATÍSTICAS -->
        <div class="stats-video">
            <div class="stat-video-card">
                <div class="stat-video-icon"><i class="fas fa-video"></i></div>
                <div class="stat-video-info"><h3 id="totalVideos">0</h3><p>Total de vídeos</p></div>
            </div>
            <div class="stat-video-card">
                <div class="stat-video-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-video-info"><h3 id="totalLiberados">0</h3><p>Liberados</p></div>
            </div>
            <div class="stat-video-card">
                <div class="stat-video-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-video-info"><h3 id="totalAguardando">0</h3><p>Aguardando</p></div>
            </div>
            <div class="stat-video-card">
                <div class="stat-video-icon"><i class="fas fa-eye"></i></div>
                <div class="stat-video-info"><h3 id="totalVisualizacoes">0</h3><p>Visualizações</p></div>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="tabs-container">
            <button class="tab-btn active" data-filtro="aguardando" onclick="filtrarVideos('aguardando')">
                <i class="fas fa-clock"></i> Aguardando <span class="badge" id="badgeAguardando">0</span>
            </button>
            <button class="tab-btn" data-filtro="liberados" onclick="filtrarVideos('liberados')">
                <i class="fas fa-check-circle"></i> Liberados <span class="badge" id="badgeLiberados">0</span>
            </button>
        </div>

        <!-- GRID DE VÍDEOS -->
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <!-- MODAL DE EDIÇÃO / CRIAÇÃO -->
    <div id="modalVideo" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> <span id="modalVideoTitle">Editar Videoaula</span></h3>
                <span class="modal-close" onclick="fecharModalVideo()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="formVideo">
                    <input type="hidden" id="videoId">
                    <div class="form-group">
                        <label><i class="fas fa-heading"></i> Título *</label>
                        <input type="text" id="videoTitulo" required maxlength="100" placeholder="Digite o título da videoaula">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-align-left"></i> Descrição</label>
                        <textarea id="videoDescricao" rows="3" maxlength="300" placeholder="Breve descrição da aula..."></textarea>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-book"></i> Disciplina *</label>
                        <select id="videoDisciplina" required>
                            <option value="">Selecione a disciplina</option>
                            <option value="OCA1">OCA 1 - Operação de Computadores e Aplicativos I</option>
                            <option value="LTT">LTT - Linguagem, Trabalho e Tecnologia</option>
                            <option value="IMC">IMC - Instalação e Manutenção de Computadores</option>
                            <option value="PC1">PC 1 - Programação de Computadores I</option>
                            <option value="GSO1">GSO 1 - Gestão de Sistemas Operacionais I</option>
                            <option value="MBD">MBD - Modelagem de Banco de Dados</option>
                            <option value="SU">SU - Sistemas Ubíquos</option>
                            <option value="STIC">STIC - Segurança em Tecnologia da Informação</option>
                            <option value="SI">SI - Sistemas de Informação</option>
                            <option value="PTCC">PTCC - Planejamento do TCC</option>
                            <option value="SBD">SBD - Sistemas de Banco de Dados</option>
                            <option value="DSE">DSE - Desenvolvimento de Sistemas Embarcados</option>
                            <option value="RCD1">RCD 1 - Redes de Comunicação de Dados I</option>
                            <option value="PC2">PC 2 - Programação de Computadores II</option>
                            <option value="GSO2">GSO 2 - Gestão de Sistemas Operacionais II</option>
                            <option value="INGLES">Inglês - Inglês Instrumental</option>
                            <option value="SD">SD - Segurança Digital</option>
                            <option value="DTCC">DTCC - Desenvolvimento do TCC</option>
                            <option value="CNM">CNM - Computação em Nuvem</option>
                            <option value="ECO">ECO - Empreendedorismo</option>
                            <option value="IOT">IOT - Internet das Coisas</option>
                            <option value="RCD2">RCD 2 - Redes de Comunicação de Dados II</option>
                            <option value="GSO3">GSO 3 - Gestão de Sistemas Operacionais III</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-layer-group"></i> Módulo *</label>
                        <select id="videoModulo" required>
                            <option value="">Selecione o módulo</option>
                            <option value="1º Módulo">1º Módulo</option>
                            <option value="2º Módulo">2º Módulo</option>
                            <option value="3º Módulo">3º Módulo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-link"></i> URL do Vídeo (YouTube) *</label>
                        <input type="text" id="videoUrl" required placeholder="https://www.youtube.com/watch?v=... ou ID do vídeo">
                        <small style="color:#999; font-size:11px;">Pode ser a URL completa ou apenas o ID (ex: 1-w1RfGIov4)</small>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar-alt"></i> Data da Aula</label>
                        <input type="date" id="videoData">
                    </div>
                    <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Salvar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/darkmode.js"></script>
    <script>
        // =============================================
        // BANCO DE VÍDEOS
        // =============================================
        let VIDEOS = [];
        let filtroAtual = 'aguardando';
        const user = JSON.parse(localStorage.getItem('loggedUser') || '{}');

        // =============================================
        // LOCALSTORAGE
        // =============================================
        function carregarDoLocalStorage() {
            const saved = localStorage.getItem('videoaulas_professor');
            if (saved) {
                try {
                    VIDEOS = JSON.parse(saved);
                } catch(e) { VIDEOS = []; }
            }
            // Garantir que todos os vídeos tenham professor associado
            VIDEOS = VIDEOS.map(v => {
                if (!v.professor) {
                    v.professor = user.name || 'Professor';
                }
                if (!v.professorEmail) {
                    v.professorEmail = user.email || user.identifier || '';
                }
                if (!v.status) {
                    v.status = 'aguardando';
                }
                return v;
            });
            salvarNoLocalStorage();
        }

        function salvarNoLocalStorage() {
            localStorage.setItem('videoaulas_professor', JSON.stringify(VIDEOS));
        }

        // =============================================
        // FUNÇÃO PARA OBTER ID DO VÍDEO
        // =============================================
        function extractVideoId(url) {
            if (!url) return '';
            // Se for apenas o ID (ex: 1-w1RfGIov4)
            if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) {
                return url.trim();
            }
            // Se for URL completa
            const match = url.match(/(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            return match ? match[1] : '';
        }

        // =============================================
        // FILTRAR VÍDEOS
        // =============================================
        function filtrarVideos(filtro) {
            filtroAtual = filtro;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filtro === filtro) {
                    btn.classList.add('active');
                }
            });
            renderizarVideos();
        }

        // =============================================
        // RENDERIZAR
        // =============================================
        function renderizarVideos() {
            const grid = document.getElementById('videoGrid');
            
            // Filtrar apenas vídeos do professor logado
            const meusVideos = VIDEOS.filter(v => v.professorEmail === (user.email || user.identifier));
            
            let videosFiltrados = meusVideos;
            if (filtroAtual === 'liberados') {
                videosFiltrados = meusVideos.filter(v => v.status === 'liberado');
            } else if (filtroAtual === 'aguardando') {
                videosFiltrados = meusVideos.filter(v => v.status === 'aguardando');
            }

            // Atualizar badges
            document.getElementById('badgeLiberados').textContent = meusVideos.filter(v => v.status === 'liberado').length;
            document.getElementById('badgeAguardando').textContent = meusVideos.filter(v => v.status === 'aguardando').length;

            // Atualizar estatísticas
            document.getElementById('totalVideos').textContent = meusVideos.length;
            document.getElementById('totalLiberados').textContent = meusVideos.filter(v => v.status === 'liberado').length;
            document.getElementById('totalAguardando').textContent = meusVideos.filter(v => v.status === 'aguardando').length;
            document.getElementById('totalVisualizacoes').textContent = meusVideos.reduce((acc, v) => acc + (v.visualizacoes || 0), 0);

            if (videosFiltrados.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-video-slash"></i>
                        <h3>${filtroAtual === 'liberados' ? 'Nenhum vídeo liberado' : 'Nenhum vídeo aguardando liberação'}</h3>
                        <p>${filtroAtual === 'liberados' ? 'Os vídeos liberados aparecerão aqui.' : 'Os vídeos aparecerão aqui conforme forem adicionados.'}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = videosFiltrados.map(v => {
                const videoId = v.videoId || extractVideoId(v.url);
                const thumb = v.thumb || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                return `
                <div class="video-card">
                    <div class="video-thumb" onclick="abrirVideo(${v.id})">
                        <img src="${thumb}" alt="${v.titulo}" onerror="this.src='https://placehold.co/600x400/1a1a2e/666?text=${encodeURIComponent(v.titulo)}'">
                        <div class="play-overlay">
                            <i class="fas fa-play-circle"></i>
                        </div>
                        <span class="modulo-tag">${v.modulo || 'Módulo'}</span>
                        <span class="status-badge ${v.status}">
                            ${v.status === 'liberado' ? '✅ Liberado' : '⏳ Aguardando'}
                        </span>
                        <span class="duracao"><i class="fas fa-clock"></i> ${v.duracao || 'Aula'}</span>
                    </div>
                    <div class="video-info">
                        <h3>${v.titulo}</h3>
                        <div class="meta">
                            <span><i class="fas fa-chalkboard-user"></i> ${v.professor || user.name}</span>
                            <span><i class="fas fa-calendar-alt"></i> ${v.data || new Date().toLocaleDateString('pt-BR')}</span>
                            <span><i class="fas fa-book"></i> ${v.disciplina || 'Disciplina'}</span>
                            <span><i class="fas fa-eye"></i> ${v.visualizacoes || 0} views</span>
                        </div>
                        <div class="video-actions">
                            <button class="btn-assistir-prof" onclick="abrirVideo(${v.id})">
                                <i class="fas fa-play"></i> Assistir
                            </button>
                            <button class="btn-acao btn-editar-video" onclick="editarVideo(${v.id})">
                                <i class="fas fa-pen"></i> Editar
                            </button>
                            ${v.status === 'aguardando' ? 
                                `<button class="btn-acao btn-liberar" onclick="liberarVideo(${v.id})">
                                    <i class="fas fa-check"></i> Liberar
                                </button>` :
                                `<button class="btn-acao btn-ocultar" onclick="ocultarVideo(${v.id})">
                                    <i class="fas fa-eye-slash"></i> Ocultar
                                </button>`
                            }
                            <button class="btn-acao btn-excluir" onclick="excluirVideo(${v.id})">
                                <i class="fas fa-trash"></i> Excluir
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // =============================================
        // AÇÕES DO PROFESSOR
        // =============================================
        
        function liberarVideo(id) {
            const video = VIDEOS.find(v => v.id === id);
            if (!video) return;
            video.status = 'liberado';
            salvarNoLocalStorage();
            renderizarVideos();
            showNotification(`✅ "${video.titulo}" liberado para os alunos!`, 'success');
        }

        function ocultarVideo(id) {
            const video = VIDEOS.find(v => v.id === id);
            if (!video) return;
            video.status = 'aguardando';
            salvarNoLocalStorage();
            renderizarVideos();
            showNotification(`⏳ "${video.titulo}" ocultado dos alunos.`, 'info');
        }

        function excluirVideo(id) {
            const video = VIDEOS.find(v => v.id === id);
            if (!video) return;
            if (!confirm(`Tem certeza que deseja excluir "${video.titulo}"?`)) return;
            VIDEOS = VIDEOS.filter(v => v.id !== id);
            salvarNoLocalStorage();
            renderizarVideos();
            showNotification('🗑️ Vídeo excluído!', 'success');
        }

        // =============================================
        // EDIÇÃO E CRIAÇÃO
        // =============================================
        function abrirModalNovoVideo() {
            document.getElementById('videoId').value = '';
            document.getElementById('videoTitulo').value = '';
            document.getElementById('videoDescricao').value = '';
            document.getElementById('videoDisciplina').value = '';
            document.getElementById('videoModulo').value = '';
            document.getElementById('videoUrl').value = '';
            document.getElementById('videoData').value = new Date().toISOString().split('T')[0];
            document.getElementById('modalVideoTitle').textContent = 'Nova Videoaula';
            document.getElementById('modalVideo').style.display = 'flex';
        }

        function editarVideo(id) {
            const video = VIDEOS.find(v => v.id === id);
            if (!video) return;
            document.getElementById('videoId').value = video.id;
            document.getElementById('videoTitulo').value = video.titulo || '';
            document.getElementById('videoDescricao').value = video.descricao || '';
            document.getElementById('videoDisciplina').value = video.disciplina || '';
            document.getElementById('videoModulo').value = video.modulo || '';
            document.getElementById('videoUrl').value = video.url || video.videoId || '';
            document.getElementById('videoData').value = video.data ? new Date(video.data).toISOString().split('T')[0] : new Date().toISOString().split('T')[0];
            document.getElementById('modalVideoTitle').textContent = 'Editar Videoaula';
            document.getElementById('modalVideo').style.display = 'flex';
        }

        document.getElementById('formVideo').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('videoId').value;
            const titulo = document.getElementById('videoTitulo').value.trim();
            const descricao = document.getElementById('videoDescricao').value.trim();
            const disciplina = document.getElementById('videoDisciplina').value;
            const modulo = document.getElementById('videoModulo').value;
            const url = document.getElementById('videoUrl').value.trim();
            const data = document.getElementById('videoData').value;

            if (!titulo) { showNotification('Digite um título!', 'error'); return; }
            if (!disciplina) { showNotification('Selecione uma disciplina!', 'error'); return; }
            if (!modulo) { showNotification('Selecione um módulo!', 'error'); return; }
            if (!url) { showNotification('Digite a URL do vídeo!', 'error'); return; }

            const videoId = extractVideoId(url);
            if (!videoId) {
                showNotification('URL do YouTube inválida! Use o formato padrão.', 'error');
                return;
            }

            const videoData = {
                titulo: titulo,
                descricao: descricao || '',
                disciplina: disciplina,
                modulo: modulo,
                url: url,
                videoId: videoId,
                data: data || new Date().toISOString().split('T')[0],
                professor: user.name || 'Professor',
                professorEmail: user.email || user.identifier || '',
                duracao: 'Aula',
                thumb: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
                visualizacoes: 0
            };

            if (id) {
                // Editar
                const index = VIDEOS.findIndex(v => v.id === id);
                if (index !== -1) {
                    VIDEOS[index] = { ...VIDEOS[index], ...videoData };
                    showNotification('✅ Videoaula atualizada!', 'success');
                }
            } else {
                // Criar
                const novoVideo = {
                    id: Date.now() + Math.floor(Math.random() * 1000),
                    ...videoData,
                    status: 'aguardando'
                };
                VIDEOS.push(novoVideo);
                showNotification('✅ Videoaula criada!', 'success');
            }

            salvarNoLocalStorage();
            renderizarVideos();
            fecharModalVideo();
        });

        function fecharModalVideo() {
            document.getElementById('modalVideo').style.display = 'none';
        }

        // =============================================
        // ABRIR VÍDEO
        // =============================================
        function abrirVideo(id) {
            const video = VIDEOS.find(v => v.id === id);
            if (!video) return;

            video.visualizacoes = (video.visualizacoes || 0) + 1;
            salvarNoLocalStorage();

            const videoId = video.videoId || extractVideoId(video.url);
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;

            sessionStorage.setItem('video_playing', JSON.stringify({
                id: video.id,
                titulo: video.titulo,
                professor: video.professor,
                disciplina: video.disciplina,
                modulo: video.modulo,
                data: video.data,
                url: embedUrl
            }));
            sessionStorage.setItem('origem_video', window.location.pathname.split('/').pop());

            window.location.href = 'video_player.html';
        }

        // =============================================
        // NOTIFICAÇÕES
        // =============================================
        function showNotification(msg, tipo) {
            if (window.notificationSystem) {
                window.notificationSystem.show(msg, tipo);
            } else {
                alert(msg);
            }
        }

        // =============================================
        // INICIALIZAR
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            carregarDoLocalStorage();
            // Garantir que o filtro padrão seja "aguardando"
            filtroAtual = 'aguardando';
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filtro === 'aguardando') {
                    btn.classList.add('active');
                }
            });
            renderizarVideos();
            console.log('✅ Página de videoaulas inicializada com sucesso!');
        });

        // Fechar modal ao clicar fora
        document.getElementById('modalVideo').addEventListener('click', function(e) {
            if (e.target === this) fecharModalVideo();
        });

        // Expor funções globais
        window.filtrarVideos = filtrarVideos;
        window.liberarVideo = liberarVideo;
        window.ocultarVideo = ocultarVideo;
        window.excluirVideo = excluirVideo;
        window.abrirVideo = abrirVideo;
        window.editarVideo = editarVideo;
        window.abrirModalNovoVideo = abrirModalNovoVideo;
        window.fecharModalVideo = fecharModalVideo;
    </script>
</body>
</html>
