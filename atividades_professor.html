<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades - Professor | SmartClass ETEC</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; }
        
        .content { margin-left: 280px; padding: 30px; transition: margin-left 0.3s ease; min-height: 100vh; }
        
        .btn-nova-atividade {
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        .btn-nova-atividade:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,121,107,0.3); }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 18px; border: 1px solid #eef2f6; transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,121,107,0.1); }
        .stat-icon { width: 55px; height: 55px; background: #e8f5e9; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #00796b; }
        .stat-info h3 { font-size: 28px; font-weight: 700; color: #00796b; }
        .stat-info p { font-size: 13px; color: #666; margin-top: 4px; }
        
        .toolbar { background: white; border-radius: 16px; padding: 15px 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border: 1px solid #eef2f6; }
        .search-wrapper { flex: 1; min-width: 250px; position: relative; }
        .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #00796b; }
        .search-wrapper input { width: 100%; padding: 12px 15px 12px 45px; border: 1px solid #e0e0e0; border-radius: 30px; font-size: 14px; background: #f8f9fa; font-family: 'Poppins', sans-serif; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 18px; border: 1px solid #e0e0e0; background: white; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.3s; }
        .filter-btn.active { background: linear-gradient(135deg, #00796b, #004d47); color: white; border-color: transparent; }
        
        .atividades-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }
        .atividade-card { background: white; border-radius: 20px; overflow: hidden; cursor: pointer; border: 1px solid #eef2f6; transition: all 0.3s ease; }
        .atividade-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,121,107,0.12); }
        .card-top { padding: 18px 20px 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .materia-tag { padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .materia-tag.OCA1 { background: #e3f2fd; color: #1565c0; }
        .materia-tag.LTT { background: #fce4ec; color: #c62828; }
        .materia-tag.IMC { background: #e8f5e9; color: #2e7d32; }
        .materia-tag.PC1 { background: #fff3e0; color: #e65100; }
        .materia-tag.GSO1 { background: #e0f2f1; color: #00695c; }
        .materia-tag.MBD { background: #f3e5f5; color: #6a1b9a; }
        .materia-tag.SU { background: #e8f5e9; color: #2e7d32; }
        .materia-tag.STIC { background: #ffebee; color: #c62828; }
        .status-tag { padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .status-tag.aberta { background: #e8f5e9; color: #2e7d32; }
        .status-tag.encerrada { background: #f5f5f5; color: #757575; }
        .card-content { padding: 0 20px 15px; }
        .card-content h3 { font-size: 18px; color: #2d3436; margin-bottom: 10px; }
        .card-content .descricao { font-size: 13px; color: #636e72; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .turma-badge { background: #e0f2f1; padding: 4px 10px; border-radius: 15px; font-size: 10px; font-weight: 600; color: #00695c; display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; }
        .card-footer { padding: 14px 20px; background: #f8f9fa; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-top: 1px solid #eef2f6; }
        .date-info { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #636e72; }
        .points-info { background: #fff8e7; padding: 4px 12px; border-radius: 20px; color: #f39c12; font-size: 12px; font-weight: 600; }
        .entregas-count { background: #e3f2fd; padding: 4px 12px; border-radius: 20px; color: #1565c0; font-size: 12px; font-weight: 600; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; }
        .modal-container { background: white; border-radius: 24px; width: 90%; max-width: 650px; max-height: 85vh; overflow-y: auto; }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid #eef2f6; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; }
        .modal-header h3 { color: #00796b; font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .modal-close { font-size: 28px; cursor: pointer; color: #b2bec3; transition: all 0.2s; }
        .modal-close:hover { color: #c62828; }
        .modal-body { padding: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: #2d3436; }
        .form-group label i { color: #00796b; margin-right: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 14px; font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #00796b; box-shadow: 0 0 0 3px rgba(0,121,107,0.1); background: white; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .upload-area { border: 2px dashed #e0e0e0; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; background: #fafafa; margin-top: 10px; }
        .upload-area:hover { border-color: #00796b; background: #f0f7f5; }
        .upload-area i { font-size: 40px; color: #00796b; margin-bottom: 10px; }
        .upload-area p { font-size: 12px; color: #636e72; }
        .file-list { margin-top: 10px; max-height: 150px; overflow-y: auto; }
        .file-item { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; font-size: 12px; }
        .file-item i { color: #00796b; margin-right: 8px; }
        .remove-file { color: #f44336; cursor: pointer; background: none; border: none; font-size: 14px; }
        
        .btn-submit { background: linear-gradient(135deg, #00796b, #004d47); color: white; border: none; padding: 14px; border-radius: 30px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,121,107,0.3); }
        
        body.dark-mode .content { background: #0f172a; }
        body.dark-mode .stat-card, body.dark-mode .toolbar, body.dark-mode .atividade-card { background: #1e293b; border-color: #334155; }
        body.dark-mode .stat-card .stat-info h3 { color: #fbbf24; }
        body.dark-mode .stat-card .stat-info p, body.dark-mode .card-content h3, body.dark-mode .descricao, body.dark-mode .date-info { color: #cbd5e1; }
        body.dark-mode .card-footer { background: #0f172a; border-top-color: #334155; }
        body.dark-mode .modal-container, body.dark-mode .modal-header { background: #1e293b; }
        body.dark-mode .modal-header h3 { color: #fbbf24; }
        body.dark-mode .form-group label { color: #cbd5e1; }
        body.dark-mode .form-group input, body.dark-mode .form-group textarea, body.dark-mode .form-group select { background: #334155; border-color: #475569; color: #f1f5f9; }
        
        @media (max-width: 1000px) { .content { margin-left: 0; padding: 20px; } .stats-row { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) { .stats-row { grid-template-columns: 1fr; } .atividades-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="content">
    <button class="btn-nova-atividade" id="novaAtividadeBtn">
        <i class="fas fa-plus-circle"></i> Nova Atividade
    </button>

    <div class="stats-row">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-tasks"></i></div><div class="stat-info"><h3 id="totalAtividades">0</h3><p>Total</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-info"><h3 id="abertasAtividades">0</h3><p>Abertas</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h3 id="entreguesAtividades">0</h3><p>Entregues</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-star"></i></div><div class="stat-info"><h3 id="corrigidasAtividades">0</h3><p>Corrigidas</p></div></div>
    </div>

    <div class="toolbar">
        <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Buscar atividade..."></div>
        <div class="filters"><button class="filter-btn active" data-filter="todas">Todas</button><button class="filter-btn" data-filter="abertas">Abertas</button><button class="filter-btn" data-filter="encerradas">Encerradas</button></div>
    </div>

    <div class="atividades-grid" id="atividadesGrid"></div>
</div>

<!-- MODAL NOVA ATIVIDADE -->
<div id="modalAtividade" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header"><h3><i class="fas fa-plus-circle"></i> <span id="modalTitle">Nova Atividade</span></h3><span class="modal-close close-modal">&times;</span></div>
        <div class="modal-body">
            <form id="atividadeForm">
                <input type="hidden" id="atividadeId">
                <div class="form-group"><label><i class="fas fa-heading"></i> Título *</label><input type="text" id="titulo" required maxlength="100"></div>
                <div class="form-group"><label><i class="fas fa-align-left"></i> Descrição</label><textarea id="descricao" rows="3" maxlength="500" placeholder="Descreva a atividade..."></textarea></div>
                
                <div class="form-group"><label><i class="fas fa-paperclip"></i> Materiais de Apoio</label>
                    <div class="upload-area" id="uploadArea"><i class="fas fa-cloud-upload-alt"></i><p>Clique ou arraste arquivos aqui</p><p style="font-size: 10px;">PDF, DOC, DOCX, JPG, PNG (Max 10MB)</p></div>
                    <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="display: none;">
                    <div id="fileList" class="file-list"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group"><label><i class="fas fa-book"></i> Disciplina</label>
                        <select id="materia" required>
                            <option value="">Selecione a disciplina</option>
                            <optgroup label="1º Módulo - Técnico em Informática">
                                <option value="OCA1">OCA 1 - Operação de Computadores e Aplicativos I</option>
                                <option value="LTT">LTT - Linguagem, Trabalho e Tecnologia</option>
                                <option value="IMC">IMC - Instalação e Manutenção de Computadores</option>
                                <option value="PC1">PC 1 - Programação de Computadores I</option>
                                <option value="GSO1">GSO 1 - Gestão de Sistemas Operacionais I</option>
                                <option value="MBD">MBD - Modelagem de Banco de Dados</option>
                                <option value="SU">SU - Sistemas Ubíquos</option>
                                <option value="STIC">STIC - Segurança em Tecnologia da Informação e Comunicação</option>
                            </optgroup>
                            <optgroup label="2º Módulo - Técnico em Informática">
                                <option value="SI">SI - Sistemas de Informação</option>
                                <option value="PTCC">PTCC - Planejamento do Trabalho de Conclusão de Curso</option>
                                <option value="SBD">SBD - Sistemas de Banco de Dados</option>
                                <option value="DSE">DSE - Desenvolvimento de Sistemas Embarcados</option>
                                <option value="RCD1">RCD 1 - Redes de Comunicação de Dados I</option>
                                <option value="PC2">PC 2 - Programação de Computadores II</option>
                                <option value="GSO2">GSO 2 - Gestão de Sistemas Operacionais II</option>
                            </optgroup>
                            <optgroup label="3º Módulo - Técnico em Informática">
                                <option value="INGLES">Inglês - Inglês Instrumental</option>
                                <option value="SD">SD - Segurança Digital</option>
                                <option value="DTCC">DTCC - Desenvolvimento do Trabalho de Conclusão de Curso</option>
                                <option value="CNM">CNM - Computação em Nuvem</option>
                                <option value="ECO">ECO - Empreendedorismo e Comunicação Organizacional</option>
                                <option value="IOT">IOT - Internet das Coisas (IoT)</option>
                                <option value="RCD2">RCD 2 - Redes de Comunicação de Dados II</option>
                                <option value="GSO3">GSO 3 - Gestão de Sistemas Operacionais III</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group"><label><i class="fas fa-calendar-alt"></i> Data de Entrega</label><input type="date" id="dataEntrega" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label><i class="fas fa-star"></i> Pontuação</label><input type="number" id="pontuacao" value="10" min="0" max="100"></div>
                    <div class="form-group"><label><i class="fas fa-school"></i> Turma Destino</label>
                        <select id="turmaDestino" required>
                            <option value="">Selecione a turma</option>
                            <optgroup label="1º Módulo - Técnico em Informática (1º E)">
                                <option value="1E">1º E - Técnico em Informática (1º Módulo)</option>
                            </optgroup>
                            <optgroup label="2º Módulo - Técnico em Informática (2º E)">
                                <option value="2E">2º E - Técnico em Informática (2º Módulo)</option>
                            </optgroup>
                            <optgroup label="3º Módulo - Técnico em Informática (3º E)">
                                <option value="3E">3º E - Técnico em Informática (3º Módulo)</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Criar Atividade</button>
            </form>
        </div>
    </div>
</div>

<!-- MODAL DETALHES -->
<div id="modalDetalhes" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header"><h3><i class="fas fa-file-alt"></i> Detalhes da Atividade</h3><span class="modal-close close-detalhes">&times;</span></div>
        <div class="modal-body" id="detalhesContent"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/welcome-card.js"></script>

<script>
    let atividades = [];
    let filtroAtual = "todas";
    let searchTerm = "";
    let arquivosSelecionados = [];

    function formatarData(dataStr) { if (!dataStr) return "Sem data"; try { return new Date(dataStr).toLocaleDateString('pt-BR'); } catch(e) { return dataStr; } }
    
    function getTurmaNome(turmaKey) {
        const turmas = { '1E': '1º E - Técnico em Informática (1º Módulo)', '2E': '2º E - Técnico em Informática (2º Módulo)', '3E': '3º E - Técnico em Informática (3º Módulo)' };
        return turmas[turmaKey] || turmaKey;
    }

    function getMateriaNome(materiaKey) {
        const materias = {
            'OCA1': 'OCA 1 - Operação de Computadores e Aplicativos I',
            'LTT': 'LTT - Linguagem, Trabalho e Tecnologia',
            'IMC': 'IMC - Instalação e Manutenção de Computadores',
            'PC1': 'PC 1 - Programação de Computadores I',
            'GSO1': 'GSO 1 - Gestão de Sistemas Operacionais I',
            'MBD': 'MBD - Modelagem de Banco de Dados',
            'SU': 'SU - Sistemas Ubíquos',
            'STIC': 'STIC - Segurança em Tecnologia da Informação',
            'SI': 'SI - Sistemas de Informação',
            'PTCC': 'PTCC - Planejamento do TCC',
            'SBD': 'SBD - Sistemas de Banco de Dados',
            'DSE': 'DSE - Desenvolvimento de Sistemas Embarcados',
            'RCD1': 'RCD 1 - Redes de Comunicação de Dados I',
            'PC2': 'PC 2 - Programação de Computadores II',
            'GSO2': 'GSO 2 - Gestão de Sistemas Operacionais II',
            'INGLES': 'Inglês - Inglês Instrumental',
            'SD': 'SD - Segurança Digital',
            'DTCC': 'DTCC - Desenvolvimento do TCC',
            'CNM': 'CNM - Computação em Nuvem',
            'ECO': 'ECO - Empreendedorismo e Comunicação Organizacional',
            'IOT': 'IOT - Internet das Coisas (IoT)',
            'RCD2': 'RCD 2 - Redes de Comunicação de Dados II',
            'GSO3': 'GSO 3 - Gestão de Sistemas Operacionais III'
        };
        return materias[materiaKey] || materiaKey;
    }

    function validarDataEntrega(data) {
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        const dataEntrega = new Date(data);
        const dataMaxima = new Date();
        dataMaxima.setMonth(dataMaxima.getMonth() + 3);
        
        if (dataEntrega < hoje) return { valido: false, mensagem: "A data de entrega não pode ser anterior à data atual!" };
        if (dataEntrega > dataMaxima) return { valido: false, mensagem: "A data de entrega não pode ser superior a 3 meses a partir de hoje!" };
        return { valido: true, mensagem: "" };
    }

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileListDiv = document.getElementById('fileList');

    if (uploadArea) {
        uploadArea.onclick = () => fileInput.click();
        uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = '#00796b'; uploadArea.style.background = '#f0f7f5'; };
        uploadArea.ondragleave = () => { uploadArea.style.borderColor = '#e0e0e0'; uploadArea.style.background = '#fafafa'; };
        uploadArea.ondrop = (e) => { e.preventDefault(); uploadArea.style.borderColor = '#e0e0e0'; uploadArea.style.background = '#fafafa'; processarArquivos(e.dataTransfer.files); };
        fileInput.onchange = (e) => processarArquivos(e.target.files);
    }

    function processarArquivos(files) {
        for (let file of files) {
            if (file.size > 10 * 1024 * 1024) { showNotification(`Arquivo ${file.name} excede 10MB!`, 'error'); continue; }
            const reader = new FileReader();
            reader.onload = function(e) {
                arquivosSelecionados.push({ nome: file.name, tipo: file.type, dados: e.target.result });
                atualizarListaArquivos();
            };
            reader.readAsDataURL(file);
        }
    }

    function atualizarListaArquivos() {
        if (!fileListDiv) return;
        if (arquivosSelecionados.length === 0) { fileListDiv.innerHTML = ''; return; }
        fileListDiv.innerHTML = arquivosSelecionados.map((f, i) => `<div class="file-item"><i class="fas fa-file"></i><span>${f.nome}</span><button class="remove-file" onclick="removerArquivo(${i})">&times;</button></div>`).join('');
    }

    window.removerArquivo = function(i) { arquivosSelecionados.splice(i, 1); atualizarListaArquivos(); };

    function showNotification(msg, type) { alert(msg); }

    function loadAtividades() {
        const saved = localStorage.getItem("atividades_professor");
        atividades = saved ? JSON.parse(saved) : [];
        atualizarStats(); renderAtividades();
    }

    function saveAtividades() { localStorage.setItem("atividades_professor", JSON.stringify(atividades)); }

    function atualizarStats() {
        document.getElementById("totalAtividades").textContent = atividades.length;
        document.getElementById("abertasAtividades").textContent = atividades.filter(a => a.status === "aberta").length;
        const entregues = atividades.reduce((acc, a) => acc + (a.entregas?.filter(e => e.status === "entregue").length || 0), 0);
        const corrigidas = atividades.reduce((acc, a) => acc + (a.entregas?.filter(e => e.status === "corrigida").length || 0), 0);
        document.getElementById("entreguesAtividades").textContent = entregues;
        document.getElementById("corrigidasAtividades").textContent = corrigidas;
    }

    function salvarAtividade(e) {
        e.preventDefault();
        const id = document.getElementById("atividadeId").value;
        const turmaDestino = document.getElementById("turmaDestino").value;
        const dataEntrega = document.getElementById("dataEntrega").value;
        
        const validacao = validarDataEntrega(dataEntrega);
        if (!validacao.valido) { showNotification(validacao.mensagem, 'error'); return; }
        if (!turmaDestino) { showNotification("Selecione uma turma destino!", 'error'); return; }
        
        const atividadeData = {
            titulo: document.getElementById("titulo").value,
            descricao: document.getElementById("descricao").value,
            materia: document.getElementById("materia").value,
            materiaNome: getMateriaNome(document.getElementById("materia").value),
            dataEntrega: dataEntrega,
            pontuacao: parseFloat(document.getElementById("pontuacao").value),
            status: "aberta",
            turmaDestino: turmaDestino,
            anexos: arquivosSelecionados.map(a => ({ nome: a.nome, tipo: a.tipo, dados: a.dados })),
            entregas: []
        };
        
        if (id) { const index = atividades.findIndex(a => a.id === id); if (index !== -1) atividades[index] = { ...atividades[index], ...atividadeData }; }
        else { atividades.push({ id: Date.now().toString(), ...atividadeData, criadaEm: new Date().toISOString() }); }
        
        saveAtividades(); atualizarStats(); renderAtividades(); fecharModais();
        arquivosSelecionados = []; atualizarListaArquivos();
        showNotification(id ? "Atividade atualizada!" : "Atividade criada!", 'success');
        document.getElementById("atividadeForm").reset();
    }

    function renderAtividades() {
        const grid = document.getElementById("atividadesGrid");
        let filtradas = atividades.filter(a => filtroAtual === "todas" || a.status === filtroAtual);
        if (searchTerm) filtradas = filtradas.filter(a => a.titulo.toLowerCase().includes(searchTerm.toLowerCase()) || (a.descricao && a.descricao.toLowerCase().includes(searchTerm.toLowerCase())));
        filtradas.sort((a, b) => new Date(a.dataEntrega) - new Date(b.dataEntrega));
        
        if (filtradas.length === 0) { grid.innerHTML = `<div style="text-align:center; padding:60px; background:white; border-radius:20px;"><i class="fas fa-folder-open" style="font-size:48px; color:#ccc;"></i><h3>Nenhuma atividade</h3><p>Clique em Nova Atividade para criar.</p></div>`; return; }
        
        grid.innerHTML = filtradas.map(atividade => `<div class="atividade-card" data-id="${atividade.id}"><div class="card-top"><span class="materia-tag ${atividade.materia}">${atividade.materia}</span><span class="status-tag ${atividade.status}">${atividade.status === "aberta" ? "Aberta" : "Encerrada"}</span></div><div class="card-content"><h3>${atividade.titulo}</h3><p class="descricao">${atividade.descricao || "Sem descrição"}</p><div class="turma-badge"><i class="fas fa-school"></i> ${getTurmaNome(atividade.turmaDestino)}</div></div><div class="card-footer"><div class="date-info"><i class="fas fa-calendar-alt"></i> ${formatarData(atividade.dataEntrega)}</div><div class="points-info"><i class="fas fa-star"></i> ${atividade.pontuacao} pts</div><div class="entregas-count"><i class="fas fa-users"></i> ${atividade.entregas?.length || 0} entrega(s)</div></div></div>`).join('');
        
        document.querySelectorAll('.atividade-card').forEach(card => { card.onclick = () => { const id = card.dataset.id; const atividade = atividades.find(a => a.id === id); if (atividade) abrirDetalhes(atividade); }; });
    }

    function abrirDetalhes(atividade) {
        const content = document.getElementById("detalhesContent");
        let anexosHtml = '';
        if (atividade.anexos && atividade.anexos.length > 0) {
            anexosHtml = `<div style="margin-top:15px;"><strong><i class="fas fa-paperclip"></i> Materiais (${atividade.anexos.length}):</strong><div style="margin-top:8px;">${atividade.anexos.map(a => `<div><i class="fas fa-file"></i> ${a.nome}</div>`).join('')}</div></div>`;
        }
        content.innerHTML = `<h3>${atividade.titulo}</h3><p><strong>Descrição:</strong> ${atividade.descricao || "Sem descrição"}</p><p><strong>Disciplina:</strong> ${atividade.materiaNome || atividade.materia}</p><p><strong>Turma:</strong> ${getTurmaNome(atividade.turmaDestino)}</p><p><strong>Data Entrega:</strong> ${formatarData(atividade.dataEntrega)}</p><p><strong>Pontuação:</strong> ${atividade.pontuacao} pts</p>${anexosHtml}<div style="margin-top:15px;"><button class="btn-submit" onclick="editarAtividade('${atividade.id}')" style="margin-top:0;">Editar Atividade</button></div>`;
        document.getElementById("modalDetalhes").style.display = "flex";
    }

    function editarAtividade(id) {
        const atividade = atividades.find(a => a.id === id);
        if (!atividade) return;
        fecharModais();
        document.getElementById("atividadeId").value = atividade.id;
        document.getElementById("titulo").value = atividade.titulo;
        document.getElementById("descricao").value = atividade.descricao || "";
        document.getElementById("materia").value = atividade.materia;
        document.getElementById("dataEntrega").value = atividade.dataEntrega;
        document.getElementById("pontuacao").value = atividade.pontuacao;
        document.getElementById("turmaDestino").value = atividade.turmaDestino;
        document.getElementById("modalTitle").textContent = "Editar Atividade";
        document.getElementById("modalAtividade").style.display = "flex";
    }

    function fecharModais() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = "none"); }

    document.addEventListener('DOMContentLoaded', () => {
        const dataInput = document.getElementById('dataEntrega');
        if (dataInput) {
            const hoje = new Date().toISOString().split('T')[0];
            const dataMax = new Date(); dataMax.setMonth(dataMax.getMonth() + 3);
            dataInput.min = hoje;
            dataInput.max = dataMax.toISOString().split('T')[0];
        }
        
        loadAtividades();
        document.getElementById('novaAtividadeBtn').onclick = () => { document.getElementById('atividadeForm').reset(); document.getElementById('atividadeId').value = ''; document.getElementById('modalTitle').textContent = 'Nova Atividade'; document.getElementById('modalAtividade').style.display = 'flex'; };
        document.getElementById('atividadeForm').addEventListener('submit', salvarAtividade);
        document.getElementById('searchInput')?.addEventListener('input', (e) => { searchTerm = e.target.value; renderAtividades(); });
        document.querySelectorAll('.filter-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); filtroAtual = btn.dataset.filter; renderAtividades(); }; });
        document.querySelectorAll('.modal-close').forEach(btn => { btn.onclick = fecharModais; });
        window.onclick = (e) => { if (e.target.classList.contains('modal-overlay')) fecharModais(); };
        window.editarAtividade = editarAtividade;
    });
</script>
