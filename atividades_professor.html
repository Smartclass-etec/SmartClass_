<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades - Professor | SmartClass</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            background: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: #00796b;
            color: white;
            position: fixed;
            padding-top: 30px;
            overflow-y: auto;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .sidebar a {
            display: block;
            padding: 14px 25px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
            font-size: 14px;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar a:hover {
            background: #004d47;
            border-left-color: #fbbf24;
        }

        .sidebar a.active {
            background: #004d47;
            border-left-color: #fbbf24;
        }

        /* ========== CONTEÚDO PRINCIPAL ========== */
        .content {
            margin-left: 260px;
            padding: 30px;
            flex: 1;
            width: calc(100% - 260px);
            transition: all 0.3s ease;
            background: #f0f2f5;
        }

        .atividades-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Cabeçalho */
        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: #00796b;
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header p {
            color: #5a6e6a;
            font-size: 14px;
        }

        /* Botão Nova Atividade */
        .btn-nova-atividade {
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn-nova-atividade:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,121,107,0.3);
        }

        /* Cards de estatísticas */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border: 1px solid #eef2f6;
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            background: #e8f5e9;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #00796b;
        }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
            color: #00796b;
        }

        .stat-info p {
            font-size: 13px;
            color: #5a6e6a;
            margin-top: 4px;
        }

        /* Barra de ferramentas */
        .toolbar {
            background: white;
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #eef2f6;
        }

        .search-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00796b;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: #00796b;
            box-shadow: 0 0 0 3px rgba(0,121,107,0.1);
            background: white;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 18px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            color: #555;
        }

        .filter-btn:hover {
            border-color: #00796b;
            background: #f0f7f5;
            color: #00796b;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            border-color: transparent;
        }

        /* LAYOUT LADO A LADO */
        .atividades-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .coluna-esquerda {
            flex: 2;
            min-width: 0;
        }

        .coluna-direita {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Grid de atividades */
        .atividades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .atividade-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #eef2f6;
        }

        .atividade-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,121,107,0.12);
            border-color: #00796b30;
        }

        .card-top {
            padding: 18px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .materia-tag {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .materia-tag.matematica { background: #e3f2fd; color: #1565c0; }
        .materia-tag.portugues { background: #fce4ec; color: #c62828; }
        .materia-tag.ciencias { background: #e8f5e9; color: #2e7d32; }
        .materia-tag.historia { background: #fff3e0; color: #e65100; }
        .materia-tag.geografia { background: #e0f2f1; color: #00695c; }
        .materia-tag.ingles { background: #f3e5f5; color: #6a1b9a; }

        .status-tag {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-tag.aberta { background: #e8f5e9; color: #2e7d32; }
        .status-tag.encerrada { background: #f5f5f5; color: #757575; }

        .card-content {
            padding: 0 20px 15px 20px;
        }

        .card-content h3 {
            font-size: 18px;
            color: #2d3436;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-content .descricao {
            font-size: 13px;
            color: #636e72;
            line-height: 1.5;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .turma-badge {
            background: #e0f2f1;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
            color: #00695c;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }

        .card-footer {
            padding: 14px 20px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid #eef2f6;
        }

        .date-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #636e72;
        }

        .date-info i { color: #00796b; }

        .points-info {
            background: #fff8e7;
            padding: 4px 12px;
            border-radius: 20px;
            color: #f39c12;
            font-size: 12px;
            font-weight: 600;
        }

        .entregas-count {
            background: #e3f2fd;
            padding: 4px 12px;
            border-radius: 20px;
            color: #1565c0;
            font-size: 12px;
            font-weight: 600;
        }

        /* PAINEL DIREITO - ESTATÍSTICAS */
        .painel-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #eef2f6;
            transition: all 0.3s ease;
        }

        .painel-card h3 {
            color: #00796b;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eef2f6;
        }

        .grafico-container {
            position: relative;
            height: 200px;
        }

        .turma-stats-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eef2f6;
        }

        .turma-stats-item:last-child {
            border-bottom: none;
        }

        .turma-nome {
            font-size: 13px;
            font-weight: 500;
            color: #2d3436;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .turma-nome i { color: #00796b; }

        .turma-numbers {
            display: flex;
            gap: 12px;
            font-size: 12px;
        }

        .turma-numbers span {
            padding: 3px 8px;
            border-radius: 20px;
        }

        .entrega-badge {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .pendente-badge {
            background: #fff3e0;
            color: #e65100;
        }

        .resumo-tarefas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .tarefa-stat {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 16px;
        }

        .tarefa-stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #00796b;
        }

        .tarefa-stat-label {
            font-size: 11px;
            color: #5a6e6a;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #f8f9fa;
            border-radius: 15px;
            color: #5a6e6a;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-container {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
        }

        .modal-header h3 {
            color: #00796b;
            font-size: 20px;
        }

        .modal-close {
            font-size: 28px;
            cursor: pointer;
            color: #b2bec3;
        }

        .modal-close:hover { color: #c62828; }

        .modal-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #2d3436;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00796b;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,121,107,0.3);
        }

        .btn-corrigir, .btn-encerrar {
            padding: 8px 16px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            margin-top: 8px;
        }

        .btn-corrigir {
            background: #f39c12;
            color: white;
        }

        .btn-encerrar {
            background: #e74c3c;
            color: white;
        }

        .custom-notification {
            position: fixed;
            top: 20px;
            right: -300px;
            padding: 14px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            transition: right 0.3s ease;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .custom-notification.show { right: 20px; }
        .custom-notification.success { background: #00796b; color: white; }
        .custom-notification.error { background: #e74c3c; color: white; }

        /* ========== MODO ESCURO ========== */
        body.dark-mode {
            background: #0f172a;
        }

        body.dark-mode .sidebar {
            background: #0f172a;
            border-right: 1px solid #1e293b;
        }

        body.dark-mode .sidebar a:hover,
        body.dark-mode .sidebar a.active {
            background: #1e293b;
        }

        body.dark-mode .content {
            background: #0f172a;
        }

        body.dark-mode .page-header h1 {
            color: #fbbf24;
        }

        body.dark-mode .page-header p {
            color: #94a3b8;
        }

        body.dark-mode .stat-card,
        body.dark-mode .toolbar,
        body.dark-mode .atividade-card,
        body.dark-mode .painel-card {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark-mode .stat-icon {
            background: #334155;
            color: #fbbf24;
        }

        body.dark-mode .stat-info h3 {
            color: #fbbf24;
        }

        body.dark-mode .stat-info p,
        body.dark-mode .card-content h3,
        body.dark-mode .descricao,
        body.dark-mode .date-info,
        body.dark-mode .turma-nome {
            color: #cbd5e1;
        }

        body.dark-mode .card-footer {
            background: #0f172a;
            border-top-color: #334155;
        }

        body.dark-mode .search-wrapper input {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }

        body.dark-mode .filter-btn {
            background: #334155;
            border-color: #475569;
            color: #94a3b8;
        }

        body.dark-mode .filter-btn.active {
            background: #fbbf24;
            color: #0f172a;
        }

        body.dark-mode .turma-badge {
            background: #334155;
            color: #fbbf24;
        }

        body.dark-mode .turma-stats-item {
            border-bottom-color: #334155;
        }

        body.dark-mode .turma-numbers span {
            background: #334155;
            color: #cbd5e1;
        }

        body.dark-mode .tarefa-stat {
            background: #334155;
        }

        body.dark-mode .tarefa-stat-value {
            color: #fbbf24;
        }

        body.dark-mode .tarefa-stat-label,
        body.dark-mode .empty-state {
            color: #94a3b8;
        }

        body.dark-mode .empty-state {
            background: #334155;
        }

        body.dark-mode .modal-container,
        body.dark-mode .modal-header {
            background: #1e293b;
        }

        body.dark-mode .modal-header {
            border-bottom-color: #334155;
        }

        body.dark-mode .modal-header h3 {
            color: #fbbf24;
        }

        body.dark-mode .form-group label {
            color: #cbd5e1;
        }

        body.dark-mode .form-group input,
        body.dark-mode .form-group textarea,
        body.dark-mode .form-group select {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }

        @media (max-width: 1100px) {
            .atividades-layout {
                flex-direction: column;
            }
            .coluna-direita {
                min-width: auto;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            .content {
                margin-left: 200px;
                width: calc(100% - 200px);
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .atividades-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        
        <div style="padding: 15px 25px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
                <span>🌙 Modo Escuro</span>
            </label>
        </div>
        
    </div>

    <div class="content">
        <div class="atividades-container">
            <div class="page-header">
                <h1><i class="fas fa-tasks"></i> Gerenciar Atividades</h1>
                <p>Crie, gerencie e corrija atividades dos alunos</p>
            </div>

            <button class="btn-nova-atividade" id="novaAtividadeBtn">
                <i class="fas fa-plus-circle"></i> Nova Atividade
            </button>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-tasks"></i></div>
                    <div class="stat-info"><h3 id="totalAtividades">0</h3><p>Total</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-clock"></i></div>
                    <div class="stat-info"><h3 id="abertasAtividades">0</h3><p>Abertas</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-info"><h3 id="entreguesAtividades">0</h3><p>Entregues</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-star"></i></div>
                    <div class="stat-info"><h3 id="corrigidasAtividades">0</h3><p>Corrigidas</p></div>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar atividade...">
                </div>
                <div class="filters">
                    <label style="display: flex; align-items: center; gap: 8px; margin-right: 10px;">
                        <i class="fas fa-school"></i>
                        <select id="filtroTurma" style="padding: 8px 15px; border-radius: 30px; border: 1px solid #e0e0e0;">
                            <option value="todas">Todas as turmas</option>
                        </select>
                    </label>
                    <button class="filter-btn active" data-filter="todas">Todas</button>
                    <button class="filter-btn" data-filter="abertas">Abertas</button>
                    <button class="filter-btn" data-filter="encerradas">Encerradas</button>
                </div>
            </div>

            <!-- LAYOUT LADO A LADO -->
            <div class="atividades-layout">
                <!-- COLUNA ESQUERDA: ATIVIDADES -->
                <div class="coluna-esquerda">
                    <div class="atividades-grid" id="atividadesGrid"></div>
                </div>

                <!-- COLUNA DIREITA: ESTATÍSTICAS -->
                <div class="coluna-direita">
                    <div class="painel-card">
                        <h3><i class="fas fa-chart-bar"></i> Entregas por Turma</h3>
                        <div class="grafico-container">
                            <canvas id="graficoEntregas" width="400" height="200"></canvas>
                        </div>
                    </div>

                    <div class="painel-card">
                        <h3><i class="fas fa-clipboard-list"></i> Resumo de Tarefas</h3>
                        <div class="resumo-tarefas">
                            <div class="tarefa-stat">
                                <div class="tarefa-stat-value" id="totalEntregas">0</div>
                                <div class="tarefa-stat-label">Total de Entregas</div>
                            </div>
                            <div class="tarefa-stat">
                                <div class="tarefa-stat-value" id="pendentesCorrecao">0</div>
                                <div class="tarefa-stat-label">Pendentes de Correção</div>
                            </div>
                        </div>
                    </div>

                    <div class="painel-card">
                        <h3><i class="fas fa-school"></i> Desempenho por Turma</h3>
                        <div id="turmasStats"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NOVA ATIVIDADE -->
    <div id="modalAtividade" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle"></i> <span id="modalTitle">Nova Atividade</span></h3>
                <span class="modal-close close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="atividadeForm">
                    <input type="hidden" id="atividadeId">
                    <div class="form-group">
                        <label>Título *</label>
                        <input type="text" id="titulo" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="descricao" rows="3" maxlength="500"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Matéria</label>
                            <select id="materia" required>
                                <option value="">Selecione</option>
                                <option value="matematica">Matemática</option>
                                <option value="portugues">Português</option>
                                <option value="ciencias">Ciências</option>
                                <option value="historia">História</option>
                                <option value="geografia">Geografia</option>
                                <option value="ingles">Inglês</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Data Entrega</label>
                            <input type="date" id="dataEntrega" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pontuação</label>
                            <input type="number" id="pontuacao" value="10" min="0" max="100">
                        </div>
                        <div class="form-group">
                            <label>Turma Destino</label>
                            <select id="turmaDestino" required>
                                <option value="">Selecione a turma</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Criar Atividade</button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL DETALHES -->
    <div id="modalDetalhes" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-file-alt"></i> Detalhes da Atividade</h3>
                <span class="modal-close close-detalhes">&times;</span>
            </div>
            <div class="modal-body" id="detalhesContent"></div>
        </div>
    </div>

    <!-- MODAL CORRIGIR -->
    <div id="modalCorrigir" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3><i class="fas fa-check-double"></i> Corrigir Entrega</h3>
                <span class="modal-close close-corrigir">&times;</span>
            </div>
            <div class="modal-body" id="corrigirContent"></div>
        </div>
    </div>

    <script>
        // ========== DADOS GLOBAIS ==========
        let atividades = [];
        let filtroAtual = "todas";
        let searchTerm = "";
        let filtroTurma = "todas";
        let grafico = null;

        const MAX_ATIVIDADES = 20;
        const STORAGE_KEY = "atividades_professor";

        const turmasDisponiveis = [
            { serie: "9ano", nome: "9º Ano", turmas: ["A", "B", "C"] },
            { serie: "1anoEM", nome: "1º Ano EM", turmas: ["A", "B", "C"] },
            { serie: "2anoEM", nome: "2º Ano EM", turmas: ["A", "B", "C"] },
            { serie: "3anoEM", nome: "3º Ano EM", turmas: ["A", "B", "C"] }
        ];

        const nomesMaterias = {
            matematica: "Matemática", portugues: "Português", ciencias: "Ciências",
            historia: "História", geografia: "Geografia", ingles: "Inglês"
        };

        // ========== FUNÇÕES AUXILIARES ==========
        function formatarData(dataStr) {
            if (!dataStr) return "Sem data";
            try {
                return new Date(dataStr).toLocaleDateString('pt-BR');
            } catch(e) { return dataStr; }
        }

        function getTurmaNome(turmaKey) {
            if (!turmaKey) return "Sem turma";
            const [serie, turma] = turmaKey.split('_');
            const serieObj = turmasDisponiveis.find(s => s.serie === serie);
            return serieObj ? `${serieObj.nome} - Turma ${turma}` : turmaKey;
        }

        function getAlunosDaTurma(serie, turma) {
            return JSON.parse(localStorage.getItem(`alunos_turma_${serie}_${turma}`) || '[]');
        }

        function showNotification(msg, type) {
    if (window.notificationSystem) {
        window.notificationSystem.show(msg, type === 'success' ? 'success' : 'error');
    }
}

        function carregarOpcoesTurmas() {
            const selectDestino = document.getElementById('turmaDestino');
            const selectFiltro = document.getElementById('filtroTurma');
            
            if (selectDestino) {
                selectDestino.innerHTML = '<option value="">Selecione a turma</option>';
                turmasDisponiveis.forEach(serie => {
                    serie.turmas.forEach(turma => {
                        const valor = `${serie.serie}_${turma}`;
                        const nome = `${serie.nome} - Turma ${turma}`;
                        selectDestino.innerHTML += `<option value="${valor}">${nome}</option>`;
                        if (selectFiltro) selectFiltro.innerHTML += `<option value="${valor}">${nome}</option>`;
                    });
                });
            }
        }

        // ========== CRUD ATIVIDADES ==========
        function loadAtividades() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                atividades = JSON.parse(saved);
            } else {
                atividades = [];
            }
            atualizarStats();
            renderAtividades();
            atualizarPainelDireito();
        }

        function saveAtividades() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(atividades.slice(0, MAX_ATIVIDADES)));
        }

        function atualizarStats() {
            const total = atividades.length;
            const abertas = atividades.filter(a => a.status === "aberta").length;
            const entregues = atividades.reduce((acc, a) => acc + (a.entregas?.filter(e => e.status === "entregue").length || 0), 0);
            const corrigidas = atividades.reduce((acc, a) => acc + (a.entregas?.filter(e => e.status === "corrigida").length || 0), 0);
            
            document.getElementById("totalAtividades").textContent = total;
            document.getElementById("abertasAtividades").textContent = abertas;
            document.getElementById("entreguesAtividades").textContent = entregues;
            document.getElementById("corrigidasAtividades").textContent = corrigidas;
        }

        function filtrarAtividades() {
            let filtradas = [...atividades];
            
            if (filtroAtual !== "todas") {
                filtradas = filtradas.filter(a => a.status === filtroAtual);
            }
            
            if (filtroTurma !== "todas") {
                filtradas = filtradas.filter(a => a.turmaDestino === filtroTurma);
            }
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtradas = filtradas.filter(a => a.titulo.toLowerCase().includes(term) || (a.descricao && a.descricao.toLowerCase().includes(term)));
            }
            
            filtradas.sort((a, b) => new Date(a.dataEntrega) - new Date(b.dataEntrega));
            return filtradas.slice(0, MAX_ATIVIDADES);
        }

        function renderAtividades() {
            const grid = document.getElementById("atividadesGrid");
            if (!grid) return;
            
            const filtradas = filtrarAtividades();
            
            if (filtradas.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><h3>Nenhuma atividade</h3><p>Clique em Nova Atividade para criar.</p></div>`;
                return;
            }
            
            grid.innerHTML = filtradas.map(atividade => {
                const entregasCount = atividade.entregas?.length || 0;
                const statusClass = atividade.status === "aberta" ? "aberta" : "encerrada";
                const statusTexto = atividade.status === "aberta" ? "Aberta" : "Encerrada";
                const turmaNome = getTurmaNome(atividade.turmaDestino);
                const materiaClass = atividade.materia;
                
                return `
                    <div class="atividade-card" data-id="${atividade.id}">
                        <div class="card-top">
                            <span class="materia-tag ${materiaClass}"><i class="fas fa-book"></i> ${nomesMaterias[atividade.materia] || atividade.materia}</span>
                            <span class="status-tag ${statusClass}">${statusTexto}</span>
                        </div>
                        <div class="card-content">
                            <h3>${atividade.titulo}</h3>
                            <p class="descricao">${atividade.descricao || "Sem descrição"}</p>
                            <div class="turma-badge"><i class="fas fa-school"></i> ${turmaNome}</div>
                        </div>
                        <div class="card-footer">
                            <div class="date-info"><i class="fas fa-calendar-alt"></i> ${formatarData(atividade.dataEntrega)}</div>
                            <div class="points-info"><i class="fas fa-star"></i> ${atividade.pontuacao} pts</div>
                            <div class="entregas-count"><i class="fas fa-users"></i> ${entregasCount} entrega(s)</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.querySelectorAll('.atividade-card').forEach(card => {
                card.onclick = () => {
                    const id = card.dataset.id;
                    const atividade = atividades.find(a => a.id === id);
                    if (atividade) abrirDetalhes(atividade);
                };
            });
        }

        function salvarAtividade(e) {
            e.preventDefault();
            const id = document.getElementById("atividadeId").value;
            const turmaDestino = document.getElementById("turmaDestino").value;
            
            if (!turmaDestino) {
                showNotification("Selecione uma turma destino!", "error");
                return;
            }
            
            const atividadeData = {
                titulo: document.getElementById("titulo").value,
                descricao: document.getElementById("descricao").value,
                materia: document.getElementById("materia").value,
                dataEntrega: document.getElementById("dataEntrega").value,
                pontuacao: parseFloat(document.getElementById("pontuacao").value),
                status: "aberta",
                turmaDestino: turmaDestino,
                entregas: []
            };
            
            if (id) {
                const index = atividades.findIndex(a => a.id === id);
                if (index !== -1) atividades[index] = { ...atividades[index], ...atividadeData };
            } else {
                if (atividades.length >= MAX_ATIVIDADES) {
                    showNotification(`Limite de ${MAX_ATIVIDADES} atividades atingido!`, "error");
                    return;
                }
                atividades.push({ id: Date.now().toString(), ...atividadeData, criadaEm: new Date().toISOString() });
            }
            
            saveAtividades();
            atualizarStats();
            renderAtividades();
            atualizarPainelDireito();
            fecharModais();
            showNotification(id ? "Atividade atualizada!" : "Atividade criada!", "success");
        }

        function abrirDetalhes(atividade) {
            const content = document.getElementById("detalhesContent");
            const entregas = atividade.entregas || [];
            
            let entregasHtml = `<h4 style="margin-top:20px;"><i class="fas fa-users"></i> Entregas (${entregas.length})</h4>`;
            if (entregas.length === 0) {
                entregasHtml += `<p class="empty-state">Nenhuma entrega ainda.</p>`;
            } else {
                entregas.forEach(e => {
                    entregasHtml += `
                        <div style="background:#f8f9fa; border-radius:12px; padding:12px; margin-bottom:10px;">
                            <div><strong>${e.nome}</strong> - ${e.email}</div>
                            ${e.resposta ? `<div style="font-size:12px; margin-top:5px;">Resposta: ${e.resposta}</div>` : ''}
                            <div style="margin-top:8px;">
                                <span style="color:${e.status === 'corrigida' ? '#2e7d32' : '#e65100'};">${e.status === 'corrigida' ? '✅ Corrigida' : '⏳ Pendente'}</span>
                                ${e.nota ? `<strong> Nota: ${e.nota}/10</strong>` : ''}
                                ${e.status !== 'corrigida' ? `<button class="btn-corrigir" onclick="abrirCorrecao('${atividade.id}', '${e.email}')">Corrigir</button>` : ''}
                            </div>
                        </div>
                    `;
                });
            }
            
            content.innerHTML = `
                <h3 style="color:#00796b;">${atividade.titulo}</h3>
                <p><strong>Descrição:</strong> ${atividade.descricao || "Sem descrição"}</p>
                <p><strong>Matéria:</strong> ${nomesMaterias[atividade.materia]}</p>
                <p><strong>Turma:</strong> ${getTurmaNome(atividade.turmaDestino)}</p>
                <p><strong>Data Entrega:</strong> ${formatarData(atividade.dataEntrega)}</p>
                <p><strong>Pontuação:</strong> ${atividade.pontuacao} pts</p>
                ${entregasHtml}
                <div style="display:flex; gap:10px; margin-top:15px;">
                    ${atividade.status === "aberta" ? `<button class="btn-encerrar" onclick="encerrarAtividade('${atividade.id}')">Encerrar Atividade</button>` : ''}
                    <button class="btn-submit" onclick="abrirEdicao('${atividade.id}')" style="margin-top:0;">Editar</button>
                </div>
            `;
            document.getElementById("modalDetalhes").style.display = "flex";
        }

        function abrirEdicao(id) {
            const atividade = atividades.find(a => a.id === id);
            if (!atividade) return;
            fecharModais();
            document.getElementById("atividadeId").value = atividade.id;
            document.getElementById("titulo").value = atividade.titulo;
            document.getElementById("descricao").value = atividade.descricao || "";
            document.getElementById("materia").value = atividade.materia;
            document.getElementById("dataEntrega").value = atividade.dataEntrega;
            document.getElementById("pontuacao").value = atividade.pontuacao;
            document.getElementById("turmaDestino").value = atividade.turmaDestino;
            document.getElementById("modalTitle").textContent = "Editar Atividade";
            document.getElementById("modalAtividade").style.display = "flex";
        }

        function encerrarAtividade(id) {
            const atividade = atividades.find(a => a.id === id);
            if (atividade) {
                atividade.status = "encerrada";
                saveAtividades();
                atualizarStats();
                renderAtividades();
                atualizarPainelDireito();
                fecharModais();
                showNotification("Atividade encerrada!", "info");
            }
        }

        function abrirCorrecao(atividadeId, alunoEmail) {
            const atividade = atividades.find(a => a.id === atividadeId);
            if (!atividade) return;
            
            const entrega = atividade.entregas?.find(e => e.email === alunoEmail);
            if (!entrega) return;
            
            const content = document.getElementById("corrigirContent");
            content.innerHTML = `
                <h4>Corrigindo entrega de ${entrega.nome}</h4>
                <div style="background:#f8f9fa; padding:15px; border-radius:12px; margin:15px 0;">
                    <strong>Resposta:</strong><br>${entrega.resposta || "Sem resposta"}
                </div>
                <div class="form-group">
                    <label>Nota (0-10)</label>
                    <input type="number" id="notaCorrecao" min="0" max="10" step="0.5" value="${entrega.nota || 7}">
                </div>
                <div class="form-group">
                    <label>Feedback</label>
                    <textarea id="feedbackCorrecao" rows="3">${entrega.feedback || ""}</textarea>
                </div>
                <button class="btn-submit" onclick="salvarCorrecao('${atividadeId}', '${alunoEmail}')">Salvar Correção</button>
            `;
            document.getElementById("modalCorrigir").style.display = "flex";
        }

        function salvarCorrecao(atividadeId, alunoEmail) {
            const atividade = atividades.find(a => a.id === atividadeId);
            if (atividade && atividade.entregas) {
                const entrega = atividade.entregas.find(e => e.email === alunoEmail);
                if (entrega) {
                    entrega.status = "corrigida";
                    entrega.nota = parseFloat(document.getElementById("notaCorrecao").value) || 0;
                    entrega.feedback = document.getElementById("feedbackCorrecao").value || "";
                    saveAtividades();
                    atualizarStats();
                    renderAtividades();
                    atualizarPainelDireito();
                    fecharModais();
                    showNotification("Correção salva!", "success");
                }
            }
        }

        // ========== PAINEL DIREITO ==========
        function calcularEntregasPorTurma() {
            const resultado = {};
            turmasDisponiveis.forEach(serie => {
                serie.turmas.forEach(turma => {
                    const chave = `${serie.serie}_${turma}`;
                    const alunos = getAlunosDaTurma(serie.serie, turma);
                    let entregas = 0;
                    let totalAtividades = 0;
                    
                    atividades.forEach(a => {
                        if (a.turmaDestino === chave) {
                            totalAtividades++;
                            entregas += a.entregas?.length || 0;
                        }
                    });
                    
                    resultado[chave] = {
                        nome: `${serie.nome} - Turma ${turma}`,
                        entregas,
                        totalAlunos: alunos.length,
                        totalAtividades,
                        pendentes: Math.max(0, (alunos.length * totalAtividades) - entregas)
                    };
                });
            });
            return resultado;
        }

        function atualizarGrafico() {
            const dados = calcularEntregasPorTurma();
            const turmasComDados = Object.entries(dados).filter(([_, d]) => d.totalAtividades > 0);
            
            if (turmasComDados.length === 0) return;
            
            const labels = turmasComDados.map(([_, d]) => d.nome.substring(0, 15));
            const entregasData = turmasComDados.map(([_, d]) => d.entregas);
            
            const ctx = document.getElementById('graficoEntregas').getContext('2d');
            if (grafico) grafico.destroy();
            
            grafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Entregas',
                        data: entregasData,
                        backgroundColor: '#00796b',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: true, title: { display: true, text: 'Entregas' } } }
                }
            });
        }

        function atualizarResumo() {
            let totalEntregas = 0;
            let pendentes = 0;
            
            atividades.forEach(a => {
                if (a.entregas) {
                    a.entregas.forEach(e => {
                        totalEntregas++;
                        if (e.status === "entregue") pendentes++;
                    });
                }
            });
            
            document.getElementById('totalEntregas').textContent = totalEntregas;
            document.getElementById('pendentesCorrecao').textContent = pendentes;
        }

        function atualizarDesempenhoTurmas() {
            const dados = calcularEntregasPorTurma();
            const container = document.getElementById('turmasStats');
            const turmasComDados = Object.entries(dados).filter(([_, d]) => d.totalAtividades > 0);
            
            if (turmasComDados.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhuma atividade por turma</div>';
                return;
            }
            
            container.innerHTML = turmasComDados.map(([_, data]) => {
                const taxa = data.totalAlunos > 0 && data.totalAtividades > 0 
                    ? Math.round((data.entregas / (data.totalAlunos * data.totalAtividades)) * 100) 
                    : 0;
                return `
                    <div class="turma-stats-item">
                        <div class="turma-nome"><i class="fas fa-users"></i> ${data.nome}</div>
                        <div class="turma-numbers">
                            <span class="entrega-badge">📦 ${data.entregas}</span>
                            <span class="pendente-badge">⏳ ${data.pendentes}</span>
                            <span>📊 ${taxa}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function atualizarPainelDireito() {
            atualizarGrafico();
            atualizarResumo();
            atualizarDesempenhoTurmas();
        }

        // ========== MODAIS ==========
        function fecharModais() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = "none");
        }

        // ========== DARK MODE ==========
        function toggleDarkMode() {
            const isDark = document.getElementById('darkModeToggle').checked;
            if (isDark) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'disabled');
            }
        }

        function aplicarDarkMode() {
            const darkMode = localStorage.getItem('darkMode') === 'enabled';
            if (darkMode) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
        }

        function sairDoSistema() {
            localStorage.removeItem("loggedUser");
            localStorage.removeItem("tipoUsuario");
            window.location.href = "index.html";
        }

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', () => {
            carregarOpcoesTurmas();
            loadAtividades();
            aplicarDarkMode();
            
            document.getElementById('novaAtividadeBtn').onclick = () => {
                document.getElementById('atividadeForm').reset();
                document.getElementById('atividadeId').value = '';
                document.getElementById('modalTitle').textContent = 'Nova Atividade';
                document.getElementById('modalAtividade').style.display = 'flex';
            };
            
            document.getElementById('atividadeForm').addEventListener('submit', salvarAtividade);
            
            document.getElementById('filtroTurma')?.addEventListener('change', (e) => {
                filtroTurma = e.target.value;
                renderAtividades();
            });
            
            document.getElementById('searchInput')?.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                renderAtividades();
            });
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filtroAtual = btn.dataset.filter;
                    renderAtividades();
                };
            });
            
            document.querySelectorAll('.modal-close, .close-modal, .close-detalhes, .close-corrigir').forEach(btn => {
                btn.onclick = fecharModais;
            });
            
            window.onclick = (e) => {
                if (e.target.classList.contains('modal-overlay')) fecharModais();
            };
            
            window.abrirCorrecao = abrirCorrecao;
            window.salvarCorrecao = salvarCorrecao;
            window.abrirEdicao = abrirEdicao;
            window.encerrarAtividade = encerrarAtividade;
            window.sairDoSistema = sairDoSistema;
            window.toggleDarkMode = toggleDarkMode;
        });
    </script>

    <script src="js/darkmode.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
