<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades - Aluno | SmartClass</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            background: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease;
        }

        .content {
            margin-left: 260px;
            padding: 25px;
            flex: 1;
            background: #f0f2f5;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #00796b;
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header p {
            color: #666;
            font-size: 14px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #eef2f6;
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            background: #e8f5e9;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #00796b;
        }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
            color: #00796b;
        }

        .stat-info p {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        .toolbar {
            background: white;
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #eef2f6;
        }

        .search-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00796b;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            font-size: 14px;
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 18px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #555;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            border-color: transparent;
        }

        .atividades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 25px;
        }

        .atividade-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            cursor: pointer;
            border: 1px solid #eef2f6;
            transition: all 0.3s ease;
        }

        .atividade-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,121,107,0.12);
        }

        .card-top {
            padding: 18px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
        }

        .materia-tag {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .materia-tag.matematica { background: #e3f2fd; color: #1565c0; }
        .materia-tag.portugues { background: #fce4ec; color: #c62828; }
        .materia-tag.ciencias { background: #e8f5e9; color: #2e7d32; }
        .materia-tag.historia { background: #fff3e0; color: #e65100; }
        .materia-tag.geografia { background: #e0f2f1; color: #00695c; }
        .materia-tag.ingles { background: #f3e5f5; color: #6a1b9a; }

        .status-tag {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-tag.aberta { background: #e8f5e9; color: #2e7d32; }
        .status-tag.entregue { background: #e3f2fd; color: #1565c0; }
        .status-tag.corrigida { background: #e8f5e9; color: #2e7d32; }

        .card-content {
            padding: 0 20px 15px 20px;
        }

        .card-content h3 {
            font-size: 18px;
            color: #2d3436;
            margin-bottom: 10px;
        }

        .card-content .descricao {
            font-size: 13px;
            color: #636e72;
            line-height: 1.5;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            padding: 14px 20px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid #eef2f6;
        }

        .date-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #636e72;
        }

        .points-info {
            background: #fff8e7;
            padding: 4px 12px;
            border-radius: 20px;
            color: #f39c12;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            grid-column: 1/-1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-container {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
        }

        .modal-header h3 {
            color: #00796b;
            font-size: 20px;
        }

        .modal-close {
            font-size: 28px;
            cursor: pointer;
            color: #b2bec3;
        }

        .modal-body {
            padding: 25px;
        }

        .btn-entregar {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
        }

        .feedback-card {
            background: linear-gradient(135deg, #e8f5e9, #c8e6d9);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #4caf50;
        }

        .custom-notification {
            position: fixed;
            top: 20px;
            right: -300px;
            padding: 14px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            transition: right 0.3s ease;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .custom-notification.show { right: 20px; }
        .custom-notification.success { background: #00796b; color: white; }
        .custom-notification.error { background: #f44336; color: white; }

        body.dark-mode {
            background: #0f172a;
        }

        body.dark-mode .content {
            background: #0f172a;
        }

        body.dark-mode .stat-card,
        body.dark-mode .toolbar,
        body.dark-mode .atividade-card,
        body.dark-mode .empty-state {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark-mode .page-header h1,
        body.dark-mode .stat-card .stat-info h3,
        body.dark-mode .card-content h3 {
            color: #fbbf24;
        }

        body.dark-mode .page-header p,
        body.dark-mode .stat-card .stat-info p,
        body.dark-mode .descricao,
        body.dark-mode .date-info {
            color: #94a3b8;
        }

        body.dark-mode .card-footer {
            background: #0f172a;
            border-top-color: #334155;
        }

        body.dark-mode .search-wrapper input {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }

        body.dark-mode .filter-btn {
            background: #334155;
            border-color: #475569;
            color: #94a3b8;
        }

        body.dark-mode .filter-btn.active {
            background: #fbbf24;
            color: #0f172a;
        }

        body.dark-mode .modal-container,
        body.dark-mode .modal-header {
            background: #1e293b;
        }

        body.dark-mode .modal-header h3 {
            color: #fbbf24;
        }

        body.dark-mode .feedback-card {
            background: #334155;
        }

        @media (max-width: 768px) {
            .content {
                margin-left: 0;
                padding: 15px;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .atividades-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="content">
    <div class="atividades-container">
        <div class="page-header">
            <h1><i class="fas fa-tasks"></i> Minhas Atividades</h1>
            <p>Acompanhe suas tarefas e entregue seus trabalhos</p>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-tasks"></i></div>
                <div class="stat-info"><h3 id="totalAtividades">0</h3><p>Total</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-info"><h3 id="pendentesAtividades">0</h3><p>Pendentes</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info"><h3 id="entreguesAtividades">0</h3><p>Entregues</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-star"></i></div>
                <div class="stat-info"><h3 id="corrigidasAtividades">0</h3><p>Corrigidas</p></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar atividade...">
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="todas">Todas</button>
                <button class="filter-btn" data-filter="abertas">Abertas</button>
                <button class="filter-btn" data-filter="entregues">Entregues</button>
            </div>
        </div>

        <div class="atividades-grid" id="atividadesGrid"></div>
    </div>
</div>

<div id="modalDetalhes" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header"><h3><i class="fas fa-file-alt"></i> Detalhes da Atividade</h3><span class="modal-close close-detalhes">&times;</span></div>
        <div class="modal-body" id="detalhesContent"></div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("loggedUser"));
    let atividades = [];
    let filtroAtual = "todas";
    let searchTerm = "";

    function formatarData(dataStr) {
        if(!dataStr) return "Sem data";
        try {
            return new Date(dataStr).toLocaleDateString('pt-BR');
        } catch(e) { return dataStr; }
    }

    function loadAtividades() {
        const todasAtividades = JSON.parse(localStorage.getItem("atividades_professor") || "[]");
        atividades = todasAtividades.filter(a => a.status !== "encerrada");
        atualizarStats();
        renderAtividades();
    }

    function atualizarStats() {
        const hoje = new Date().toISOString().split('T')[0];
        const pendentes = atividades.filter(a => a.status === "aberta" && a.dataEntrega >= hoje).length;
        const entregues = atividades.filter(a => a.entregas?.some(e => e.email === user?.email && (e.status === "entregue" || e.status === "corrigida"))).length;
        const corrigidas = atividades.filter(a => a.entregas?.some(e => e.email === user?.email && e.status === "corrigida")).length;
        
        document.getElementById("totalAtividades").textContent = atividades.length;
        document.getElementById("pendentesAtividades").textContent = pendentes;
        document.getElementById("entreguesAtividades").textContent = entregues;
        document.getElementById("corrigidasAtividades").textContent = corrigidas;
    }

    function filtrarAtividades() {
        let filtradas = [...atividades];
        const hoje = new Date().toISOString().split('T')[0];
        
        if(filtroAtual === "abertas") {
            filtradas = filtradas.filter(a => a.status === "aberta");
        } else if(filtroAtual === "entregues") {
            filtradas = filtradas.filter(a => a.entregas?.some(e => e.email === user?.email));
        }
        
        if(searchTerm) {
            const term = searchTerm.toLowerCase();
            filtradas = filtradas.filter(a => a.titulo.toLowerCase().includes(term) || (a.descricao && a.descricao.toLowerCase().includes(term)));
        }
        
        filtradas.sort((a, b) => new Date(a.dataEntrega) - new Date(b.dataEntrega));
        return filtradas;
    }

    function renderAtividades() {
        const grid = document.getElementById("atividadesGrid");
        const filtradas = filtrarAtividades();
        
        if(filtradas.length === 0) {
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><h3>Nenhuma atividade</h3><p>Aguarde novas atividades do seu professor.</p></div>`;
            return;
        }
        
        grid.innerHTML = filtradas.map(atividade => {
            const entrega = atividade.entregas?.find(e => e.email === user?.email);
            let statusClass = "aberta", statusTexto = "Aberta";
            
            if(entrega) {
                if(entrega.status === "entregue") {
                    statusClass = "entregue";
                    statusTexto = "Entregue";
                } else if(entrega.status === "corrigida") {
                    statusClass = "corrigida";
                    statusTexto = "Corrigida";
                }
            }
            
            const materiaClass = atividade.materia;
            const materiaNome = { matematica: "Matemática", portugues: "Português", ciencias: "Ciências", historia: "História", geografia: "Geografia", ingles: "Inglês" }[atividade.materia] || "Matéria";
            
            return `<div class="atividade-card" data-id="${atividade.id}">
                <div class="card-top">
                    <span class="materia-tag ${materiaClass}"><i class="fas fa-book"></i> ${materiaNome}</span>
                    <span class="status-tag ${statusClass}">${statusTexto}</span>
                </div>
                <div class="card-content">
                    <h3>${atividade.titulo}</h3>
                    <p class="descricao">${atividade.descricao || "Sem descrição"}</p>
                </div>
                <div class="card-footer">
                    <div class="date-info"><i class="fas fa-calendar-alt"></i> ${formatarData(atividade.dataEntrega)}</div>
                    <div class="points-info"><i class="fas fa-star"></i> ${atividade.pontuacao} pts</div>
                </div>
            </div>`;
        }).join('');
        
        document.querySelectorAll('.atividade-card').forEach(card => {
            card.onclick = () => {
                const id = card.dataset.id;
                const atividade = atividades.find(a => a.id === id);
                if(atividade) abrirDetalhes(atividade);
            };
        });
    }

    function abrirDetalhes(atividade) {
        const entrega = atividade.entregas?.find(e => e.email === user?.email);
        const content = document.getElementById("detalhesContent");
        
        let html = `<div><h3 style="color:#00796b;">${atividade.titulo}</h3>
            <p><strong>Descrição:</strong> ${atividade.descricao || "Sem descrição"}</p>
            <p><strong>Matéria:</strong> ${atividade.materia}</p>
            <p><strong>Data de Entrega:</strong> ${formatarData(atividade.dataEntrega)}</p>
            <p><strong>Pontuação:</strong> ${atividade.pontuacao} pts</p>`;
        
        if(entrega) {
            if(entrega.status === "entregue") {
                html += `<div class="feedback-card"><h4><i class="fas fa-check-circle"></i> Entregue!</h4>
                    <p>Sua atividade foi entregue e aguarda correção.</p></div>`;
            } else if(entrega.status === "corrigida") {
                html += `<div class="feedback-card"><h4><i class="fas fa-check-circle"></i> Corrigida!</h4>
                    <p>Nota: <strong>${entrega.nota || 0}/10</strong></p>
                    ${entrega.feedback ? `<p>Feedback: ${entrega.feedback}</p>` : ''}</div>`;
            }
        } else {
            html += `<div class="resposta-area"><label><i class="fas fa-pen"></i> Sua resposta</label>
                <textarea id="respostaAluno" rows="4" placeholder="Digite sua resposta aqui..."></textarea>
                <button class="btn-entregar" onclick="entregarAtividade('${atividade.id}')">Entregar Atividade</button></div>`;
        }
        
        html += `</div>`;
        content.innerHTML = html;
        document.getElementById("modalDetalhes").style.display = "flex";
    }

    function entregarAtividade(atividadeId) {
        const atividade = atividades.find(a => a.id === atividadeId);
        if(!atividade) return;
        
        const todasAtividades = JSON.parse(localStorage.getItem("atividades_professor") || "[]");
        const atividadeIndex = todasAtividades.findIndex(a => a.id === atividadeId);
        
        if(atividadeIndex !== -1) {
            if(!todasAtividades[atividadeIndex].entregas) todasAtividades[atividadeIndex].entregas = [];
            
            const resposta = document.getElementById("respostaAluno")?.value || "Atividade entregue";
            
            todasAtividades[atividadeIndex].entregas.push({
                email: user.email,
                nome: user.name,
                resposta: resposta,
                status: "entregue",
                dataEntregaAluno: new Date().toISOString()
            });
            
            localStorage.setItem("atividades_professor", JSON.stringify(todasAtividades));
            loadAtividades();
            fecharModal();
            showNotification("Atividade entregue com sucesso!", "success");
            
            if(window.adicionarPontosAtividade) window.adicionarPontosAtividade();
        }
    }

    function fecharModal() {
        document.getElementById("modalDetalhes").style.display = "none";
    }

   function showNotification(msg, type) {
    if (window.notificationSystem) {
        window.notificationSystem.show(msg, type === 'success' ? 'success' : 'error');
    }
}

    document.addEventListener('DOMContentLoaded', () => {
        loadAtividades();
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filtroAtual = btn.dataset.filter;
                renderAtividades();
            };
        });
        
        document.getElementById("searchInput")?.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderAtividades();
        });
        
        document.querySelectorAll('.modal-close').forEach(btn => {
            btn.onclick = fecharModal;
        });
        
        window.entregarAtividade = entregarAtividade;
    });
</script>

    <script src="js/darkmode.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
