<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aluno - Login | SmartClass ETEC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .btn-voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: white;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
        }
        
        .btn-voltar:hover {
            background: #004d47;
            transform: translateX(-3px);
        }

        /* Esconder o formulário de cadastro */
        .sign-up-container {
            display: none !important;
        }

        /* Ajustar o overlay para mostrar apenas o lado do login */
        .overlay-container {
            width: 100% !important;
            left: 0 !important;
        }

        .overlay {
            left: -100% !important;
            width: 200% !important;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%) !important;
        }

        .overlay-panel {
            width: 50% !important;
        }

        .overlay-left {
            display: flex !important;
        }

        .overlay-right {
            display: none !important;
        }

        /* Logo branca centralizada na parte verde */
        .overlay-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .overlay-logo i {
            font-size: 70px;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 60px;
            margin-bottom: 15px;
        }

        .overlay-logo h2 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .overlay-logo p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: 5px;
        }

        .overlay-tag {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
        }

        /* Tela de loading mais discreta */
        #loading-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 121, 107, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            color: white;
            font-size: 16px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<button class="btn-voltar" onclick="window.location.href='index.html'">
    <i class="fas fa-arrow-left"></i> Voltar
</button>

<div id="notification" class="notification">
    Use e-mail institucional @cps.sp.gov.br
</div>

<div class="background">
    <div class="bg bg1"></div>
    <div class="bg bg2"></div>
    <div class="overlay-verde"></div>
</div>

<div class="container">

    <div class="form-container sign-in-container">
        <form id="loginForm">
            <h1>Entrar</h1>
            <p class="subtitle">Acesse sua conta com e-mail institucional</p>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="E-mail @cps.sp.gov.br" id="loginEmail" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Senha" id="loginSenha" required>
                <span class="toggle-password" onclick="togglePassword('loginSenha', this)">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

            <button type="submit">Entrar</button>

            <div class="divider">ou</div>

            <div class="social-icons">
                <i class="fab fa-google"></i>
                <i class="fab fa-microsoft"></i>
            </div>
        </form>
    </div>

    <div class="form-container sign-up-container" style="display: none;">
        <form id="signupForm" style="display: none;">
        </form>
    </div>

    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <div class="overlay-logo">
                    <i class="fas fa-user-graduate"></i>
                    <h2>SmartClass</h2>
                    <p>Plataforma Educacional</p>
                    <div class="overlay-tag">
                        <i class="fas fa-school"></i> ETEC - Centro Paula Souza
                    </div>
                </div>
                <p style="margin-top: 20px;">Acesse sua conta com e-mail institucional</p>
                <button class="ghost" id="signIn" style="display: none;">Entrar</button>
            </div>

            <div class="overlay-panel overlay-right" style="display: none;">
                <h1>Criar conta!</h1>
                <p>Crie sua conta para começar</p>
                <button class="ghost" id="signUp">Cadastrar</button>
            </div>
        </div>
    </div>

</div>

<div id="loading-screen">
    <div class="loader"></div>
    <p>Entrando...</p>
</div>

<script src="js/app.js"></script>
<script>
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.querySelector('.container');

    if (signInButton) signInButton.style.display = 'none';
    if (signUpButton) signUpButton.style.display = 'none';

    function togglePassword(id, element) {
        const input = document.getElementById(id);
        const icon = element.querySelector("i");

        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye","fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash","fa-eye");
        }
    }

    // Função para extrair o primeiro nome do email (parte antes do ponto)
    function extrairNomeDoEmail(email) {
        let nomeParte = email.split('@')[0];
        let nome = nomeParte.split('.')[0];
        nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase();
        return nome;
    }

    const loginForm = document.getElementById('loginForm');
    const loadingScreen = document.getElementById("loading-screen");

    loginForm.addEventListener("submit", function(e){
        e.preventDefault();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginSenha').value;

        if(!email.endsWith("@cps.sp.gov.br")){
            const notification = document.getElementById("notification");
            notification.textContent = "Use um e-mail institucional @cps.sp.gov.br";
            notification.classList.add("show");
            setTimeout(()=> notification.classList.remove("show"), 3000);
            return;
        }
        
        if(password.length < 1){
            const notification = document.getElementById("notification");
            notification.textContent = "Digite sua senha";
            notification.classList.add("show");
            setTimeout(()=> notification.classList.remove("show"), 3000);
            return;
        }
        
        // Extrair o primeiro nome do email (antes do ponto)
        const nome = extrairNomeDoEmail(email);
        
        const loggedUser = {
            name: nome,
            email: email,
            password: password,
            tipo: "aluno",
            loginTemporario: true
        };
        
        localStorage.setItem("loggedUser", JSON.stringify(loggedUser));
        localStorage.setItem("tipoUsuario", "aluno");
        
        // Criar pet
        const petKey = `pet_${email}`;
        if(!localStorage.getItem(petKey)){
            localStorage.setItem(petKey, JSON.stringify({ 
                streak: 0, totalPoints: 0, lastAttendanceDate: null, level: 0,
                currentSkin: "dog", ownedItems: ["dog"], petName: nome
            }));
        }
        
        // Adicionar à turma
        const chaveAlunos = `alunos_turma_1anoEM_1A`;
        const alunosExistentes = JSON.parse(localStorage.getItem(chaveAlunos) || '[]');
        if (!alunosExistentes.some(a => a.email === email)) {
            alunosExistentes.push({ nome: nome, email: email, dataCadastro: new Date().toISOString(), serie: "1anoEM", turma: "1A" });
            localStorage.setItem(chaveAlunos, JSON.stringify(alunosExistentes));
        }
        
        loadingScreen.style.display = "flex";
        setTimeout(()=>{ window.location.href = "html/home_aluno.html"; }, 800);
    });
</script>
<!-- No final do body, antes do fechamento </body> -->
<script type="module">
    import { loginOrCreateUser } from 'js/supabase-client.js'
    
    // ===== AGUARDAR O DOM CARREGAR PRIMEIRO =====
    document.addEventListener('DOMContentLoaded', function() {
        
        // ===== PEGAR OS ELEMENTOS DEPOIS QUE O DOM EXISTE =====
        const loginForm = document.getElementById('loginForm')
        const loginEmail = document.getElementById('loginEmail')
        const loginSenha = document.getElementById('loginSenha')
        const loadingScreen = document.getElementById('loading-screen')
        const notification = document.getElementById('notification')
        
        // Função para extrair nome do email
        function extrairNomeDoEmail(email) {
            let nomeParte = email.split('@')[0]
            let nome = nomeParte.split('.')[0]
            nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase()
            return nome
        }
        
        // Função de notificação
        function showNotification(message, type = 'error') {
            if (!notification) return
            notification.textContent = message
            notification.classList.remove('success')
            if (type === 'success') {
                notification.classList.add('success')
            }
            notification.classList.add('show')
            setTimeout(() => {
                notification.classList.remove('show')
            }, 3000)
        }
        
        // ===== EVENTO DE LOGIN =====
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault()
                
                if (!loginEmail || !loginSenha) return
                
                const email = loginEmail.value.trim()
                const password = loginSenha.value
                
                // Validação do email
                if (!email.endsWith('@cps.sp.gov.br')) {
                    showNotification('Use um e-mail @cps.sp.gov.br', 'error')
                    return
                }
                
                if (!password || password.length < 1) {
                    showNotification('Digite sua senha', 'error')
                    return
                }
                
                const nome = extrairNomeDoEmail(email)
                const curso = 'DS'
                const modulo = 'DS1'
                
                // Mostrar loading
                if (loadingScreen) loadingScreen.style.display = 'flex'
                
                try {
                    // Tentar login ou criar usuário
                    const result = await loginOrCreateUser(email, password, nome, 'aluno', curso, modulo)
                    
                    if (!result.success) {
                        if (loadingScreen) loadingScreen.style.display = 'none'
                        showNotification('Erro ao fazer login: ' + result.error, 'error')
                        return
                    }
                    
                    // Salvar dados na sessão local
                    localStorage.setItem('loggedUser', JSON.stringify({
                        name: nome,
                        email: email,
                        tipo: 'aluno',
                        curso: curso,
                        modulo: modulo,
                        user_id: result.user?.id
                    }))
                    localStorage.setItem('tipoUsuario', 'aluno')
                    
                    // Redirecionar
                    setTimeout(() => {
                        window.location.href = 'html/home_aluno.html'
                    }, 1500)
                    
                } catch (error) {
                    if (loadingScreen) loadingScreen.style.display = 'none'
                    showNotification('Erro ao conectar com o servidor', 'error')
                    console.error('Erro:', error)
                }
            })
        }
        
        // ===== MÁSCARA DE CPF (se existir o campo) =====
        const loginCpf = document.getElementById('loginCpf')
        if (loginCpf) {
            loginCpf.addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '')
            })
        }
        
        // ===== TOGGLE PASSWORD =====
        window.togglePassword = function(id, element) {
            const input = document.getElementById(id)
            if (!input) return
            const icon = element.querySelector("i")
            
            if (input.type === "password") {
                input.type = "text"
                if (icon) icon.classList.replace("fa-eye", "fa-eye-slash")
            } else {
                input.type = "password"
                if (icon) icon.classList.replace("fa-eye-slash", "fa-eye")
            }
        }
    })
</script>
    
    <script src="js/notifications.js"></script>


</body>
</html>
