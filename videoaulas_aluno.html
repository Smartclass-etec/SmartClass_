<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoaulas - Aluno | SmartClass</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#f0f2f5; display:flex; }
        textarea { resize:none !important; }
        
        .content { margin-left:260px; padding:25px; flex:1; background:#f0f2f5; min-height:100vh; }
        .page-header { margin-bottom:25px; }
        .page-header h1 { color:#00796b; font-size:28px; display:flex; align-items:center; gap:12px; }
        .page-header p { color:#666; font-size:14px; }
        
        /* ===== FILTROS ===== */
        .filters-bar {
            background:white;
            border-radius:16px;
            padding:16px 20px;
            margin-bottom:25px;
            display:flex;
            gap:15px;
            flex-wrap:wrap;
            align-items:center;
            border:1px solid #eef2f6;
            box-shadow:0 2px 8px rgba(0,0,0,0.04);
        }
        .filter-group {
            display:flex;
            align-items:center;
            gap:8px;
        }
        .filter-group label {
            font-weight:600;
            color:#00796b;
            font-size:12px;
            white-space:nowrap;
        }
        .filter-group select,
        .filter-group input {
            padding:8px 14px;
            border-radius:30px;
            border:1px solid #e0e0e0;
            font-family:'Poppins',sans-serif;
            font-size:12px;
            background:#f8f9fa;
            transition:all 0.3s;
            min-width:140px;
        }
        .filter-group select:focus,
        .filter-group input:focus {
            outline:none;
            border-color:#00796b;
            box-shadow:0 0 0 3px rgba(0,121,107,0.1);
            background:white;
        }
        .filter-group input { min-width:200px; padding-left:36px; }
        .search-wrapper {
            position:relative;
            flex:1;
            min-width:200px;
        }
        .search-wrapper i {
            position:absolute;
            left:14px;
            top:50%;
            transform:translateY(-50%);
            color:#00796b;
            font-size:14px;
        }
        .search-wrapper input {
            width:100%;
            padding:8px 14px 8px 36px;
            border-radius:30px;
            border:1px solid #e0e0e0;
            font-family:'Poppins',sans-serif;
            font-size:12px;
            background:#f8f9fa;
            transition:all 0.3s;
        }
        .search-wrapper input:focus {
            outline:none;
            border-color:#00796b;
            box-shadow:0 0 0 3px rgba(0,121,107,0.1);
            background:white;
        }
        .btn-limpar-filtros {
            background:#f5f5f5;
            border:none;
            padding:8px 18px;
            border-radius:30px;
            cursor:pointer;
            font-size:12px;
            font-weight:500;
            color:#666;
            transition:all 0.3s;
            font-family:'Poppins',sans-serif;
            display:flex;
            align-items:center;
            gap:6px;
        }
        .btn-limpar-filtros:hover {
            background:#e0e0e0;
            color:#333;
        }
        
        /* ===== ESTATÍSTICAS ===== */
        .stats-video {
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:15px;
            margin-bottom:25px;
        }
        .stat-video-card {
            background:white;
            border-radius:16px;
            padding:16px 18px;
            display:flex;
            align-items:center;
            gap:14px;
            border:1px solid #eef2f6;
            transition:all 0.3s;
        }
        .stat-video-card:hover { transform:translateY(-3px); box-shadow:0 8px 25px rgba(0,121,107,0.08); }
        .stat-video-icon {
            width:44px;
            height:44px;
            background:#e8f5e9;
            border-radius:14px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            color:#00796b;
            flex-shrink:0;
        }
        .stat-video-info h3 { font-size:22px; font-weight:700; color:#00796b; line-height:1.2; }
        .stat-video-info p { font-size:11px; color:#666; margin-top:2px; }
        
        /* ===== GRID DE VÍDEOS ===== */
        .video-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
            gap:20px;
        }
        .video-card {
            background:white;
            border-radius:20px;
            overflow:hidden;
            border:1px solid #eef2f6;
            transition:all 0.3s ease;
            cursor:pointer;
        }
        .video-card:hover {
            transform:translateY(-5px);
            box-shadow:0 15px 35px rgba(0,121,107,0.12);
        }
        .video-thumb {
            background:#1a1a2e;
            height:180px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:60px;
            position:relative;
        }
        .video-thumb .play-icon {
            background:rgba(0,0,0,0.6);
            width:64px;
            height:64px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;
            transition:all 0.3s;
        }
        .video-card:hover .play-icon {
            transform:scale(1.1);
            background:rgba(0,121,107,0.8);
        }
        .video-thumb .duracao {
            position:absolute;
            bottom:12px;
            right:12px;
            background:rgba(0,0,0,0.8);
            padding:3px 10px;
            border-radius:12px;
            font-size:11px;
            font-weight:600;
        }
        .video-thumb .modulo-tag {
            position:absolute;
            top:12px;
            left:12px;
            background:rgba(0,121,107,0.85);
            padding:3px 12px;
            border-radius:12px;
            font-size:10px;
            font-weight:600;
        }
        .video-info { padding:15px 18px; }
        .video-info h3 { font-size:15px; color:#2d3436; font-weight:600; margin-bottom:5px; }
        .video-info .meta {
            font-size:12px;
            color:#888;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }
        .video-info .meta i { color:#00796b; width:16px; }
        .video-info .status {
            display:inline-block;
            padding:2px 12px;
            border-radius:20px;
            font-size:10px;
            font-weight:600;
            margin-top:8px;
        }
        .status.disponivel { background:#e8f5e9; color:#2e7d32; }
        .status.aguardando { background:#fff3e0; color:#e65100; }
        .status.assistido { background:#e3f2fd; color:#1565c0; }
        
        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align:center;
            padding:60px 20px;
            background:white;
            border-radius:20px;
            grid-column:1/-1;
            border:1px solid #eef2f6;
        }
        .empty-state i { font-size:64px; color:#ccc; margin-bottom:15px; }
        .empty-state h3 { color:#636e72; margin-bottom:8px; }
        .empty-state p { color:#b2bec3; font-size:14px; }
        
        /* ===== DARK MODE ===== */
        body.dark-mode .content { background:#0f172a; }
        body.dark-mode .filters-bar,
        body.dark-mode .stat-video-card,
        body.dark-mode .video-card,
        body.dark-mode .empty-state { background:#1e293b; border-color:#334155; }
        body.dark-mode .page-header h1 { color:#fbbf24; }
        body.dark-mode .page-header p { color:#94a3b8; }
        body.dark-mode .stat-video-info h3 { color:#fbbf24; }
        body.dark-mode .stat-video-info p { color:#94a3b8; }
        body.dark-mode .video-info h3 { color:#f1f5f9; }
        body.dark-mode .video-info .meta { color:#94a3b8; }
        body.dark-mode .filter-group label { color:#fbbf24; }
        body.dark-mode .filter-group select,
        body.dark-mode .filter-group input,
        body.dark-mode .search-wrapper input {
            background:#334155;
            border-color:#475569;
            color:#f1f5f9;
        }
        body.dark-mode .btn-limpar-filtros { background:#334155; color:#94a3b8; }
        body.dark-mode .btn-limpar-filtros:hover { background:#475569; color:#f1f5f9; }
        body.dark-mode .stat-video-icon { background:#0d4a47; color:#fbbf24; }
        
        @media (max-width:768px) {
            .content { margin-left:0; padding:15px; }
            .filters-bar { flex-direction:column; align-items:stretch; }
            .filter-group { flex-wrap:wrap; }
            .search-wrapper { min-width:100%; }
            .stats-video { grid-template-columns:repeat(2,1fr); }
            .video-grid { grid-template-columns:1fr; }
        }
        @media (max-width:480px) {
            .stats-video { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <h1><i class="fas fa-video"></i> Videoaulas</h1>
            <p>Assista às gravações das aulas liberadas pelos professores</p>
        </div>

        <!-- ESTATÍSTICAS -->
        <div class="stats-video">
            <div class="stat-video-card">
                <div class="stat-video-icon"><i class="fas fa-video"></i></div>
                <div class="stat-video-info"><h3 id="totalVideos">0</h3><p>Total de vídeos</p></div>
            </div>
            <div class="stat-video-card">
                <div class="stat-video-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-video-info"><h3 id="totalDisponiveis">0</h3><p>Disponíveis</p></div>
            </div>
            <div class="stat-video-card">
                <div class="stat-video-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-video-info"><h3 id="totalAguardando">0</h3><p>Aguardando liberação</p></div>
            </div>
            <div class="stat-video-card">
                <div class="stat-video-icon"><i class="fas fa-eye"></i></div>
                <div class="stat-video-info"><h3 id="totalAssistidos">0</h3><p>Já assistidos</p></div>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="filters-bar">
            <div class="filter-group">
                <label><i class="fas fa-layer-group"></i> Módulo:</label>
                <select id="filtroModulo">
                    <option value="todos">Todos os módulos</option>
                    <option value="TI1">1º Módulo</option>
                    <option value="TI2">2º Módulo</option>
                    <option value="TI3">3º Módulo</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-book"></i> Disciplina:</label>
                <select id="filtroDisciplina">
                    <option value="todos">Todas as disciplinas</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-filter"></i> Status:</label>
                <select id="filtroStatus">
                    <option value="todos">Todos</option>
                    <option value="disponivel">Disponíveis</option>
                    <option value="aguardando">Aguardando liberação</option>
                    <option value="assistido">Já assistidos</option>
                </select>
            </div>
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="buscaVideo" placeholder="Buscar por título ou professor...">
            </div>
            <button class="btn-limpar-filtros" onclick="limparFiltros()">
                <i class="fas fa-undo"></i> Limpar
            </button>
        </div>

        <!-- GRID DE VÍDEOS -->
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/notifications.js"></script>
    <script>
        // =============================================
        // DADOS DOS VÍDEOS (20 VÍDEOS DE EXEMPLO)
        // =============================================
        const VIDEOS = [
            // 1º Módulo - TI1
            { id:1, titulo:'OCA1 - Operação de Computadores I - Aula 01', modulo:'TI1', disciplina:'OCA1', professor:'Carlos Silva', duracao:'45min', data:'15/06/2026', status:'disponivel' },
            { id:2, titulo:'OCA1 - Operação de Computadores I - Aula 02', modulo:'TI1', disciplina:'OCA1', professor:'Carlos Silva', duracao:'50min', data:'17/06/2026', status:'disponivel' },
            { id:3, titulo:'LTT - Linguagem e Tecnologia - Aula 01', modulo:'TI1', disciplina:'LTT', professor:'Mariana Santos', duracao:'40min', data:'14/06/2026', status:'disponivel' },
            { id:4, titulo:'IMC - Instalação e Manutenção - Aula 01', modulo:'TI1', disciplina:'IMC', professor:'Roberto Almeida', duracao:'55min', data:'16/06/2026', status:'aguardando' },
            { id:5, titulo:'PC1 - Programação I - Aula 01', modulo:'TI1', disciplina:'PC1', professor:'Carlos Silva', duracao:'60min', data:'13/06/2026', status:'disponivel' },
            { id:6, titulo:'PC1 - Programação I - Aula 02', modulo:'TI1', disciplina:'PC1', professor:'Carlos Silva', duracao:'55min', data:'18/06/2026', status:'assistido' },
            { id:7, titulo:'GSO1 - Sistemas Operacionais I - Aula 01', modulo:'TI1', disciplina:'GSO1', professor:'Fernanda Lima', duracao:'50min', data:'12/06/2026', status:'disponivel' },
            // 2º Módulo - TI2
            { id:8, titulo:'MBD - Modelagem de Banco de Dados - Aula 01', modulo:'TI2', disciplina:'MBD', professor:'Mariana Santos', duracao:'45min', data:'20/06/2026', status:'disponivel' },
            { id:9, titulo:'MBD - Modelagem de Banco de Dados - Aula 02', modulo:'TI2', disciplina:'MBD', professor:'Mariana Santos', duracao:'50min', data:'22/06/2026', status:'aguardando' },
            { id:10, titulo:'SU - Segurança da Informação - Aula 01', modulo:'TI2', disciplina:'SU', professor:'Paulo Oliveira', duracao:'40min', data:'19/06/2026', status:'disponivel' },
            { id:11, titulo:'STIC - Tecnologia da Informação - Aula 01', modulo:'TI2', disciplina:'STIC', professor:'Roberto Almeida', duracao:'55min', data:'21/06/2026', status:'disponivel' },
            { id:12, titulo:'SBD - Sistemas de Banco de Dados - Aula 01', modulo:'TI2', disciplina:'SBD', professor:'Mariana Santos', duracao:'60min', data:'23/06/2026', status:'assistido' },
            { id:13, titulo:'SBD - Sistemas de Banco de Dados - Aula 02', modulo:'TI2', disciplina:'SBD', professor:'Mariana Santos', duracao:'50min', data:'25/06/2026', status:'disponivel' },
            { id:14, titulo:'RCD1 - Redes de Dados I - Aula 01', modulo:'TI2', disciplina:'RCD1', professor:'Roberto Almeida', duracao:'45min', data:'24/06/2026', status:'aguardando' },
            // 3º Módulo - TI3
            { id:15, titulo:'PC2 - Programação II - Aula 01', modulo:'TI3', disciplina:'PC2', professor:'Carlos Silva', duracao:'55min', data:'26/06/2026', status:'disponivel' },
            { id:16, titulo:'PC2 - Programação II - Aula 02', modulo:'TI3', disciplina:'PC2', professor:'Carlos Silva', duracao:'60min', data:'28/06/2026', status:'assistido' },
            { id:17, titulo:'SD - Sistemas Distribuídos - Aula 01', modulo:'TI3', disciplina:'SD', professor:'Fernanda Lima', duracao:'50min', data:'27/06/2026', status:'disponivel' },
            { id:18, titulo:'DTCC - TCC - Aula 01', modulo:'TI3', disciplina:'DTCC', professor:'Paulo Oliveira', duracao:'45min', data:'29/06/2026', status:'aguardando' },
            { id:19, titulo:'CNM - Computação em Nuvem - Aula 01', modulo:'TI3', disciplina:'CNM', professor:'Paulo Oliveira', duracao:'40min', data:'30/06/2026', status:'disponivel' },
            { id:20, titulo:'CNM - Computação em Nuvem - Aula 02', modulo:'TI3', disciplina:'CNM', professor:'Paulo Oliveira', duracao:'50min', data:'01/07/2026', status:'disponivel' }
        ];

        // =============================================
        // ESTADO
        // =============================================
        let filtroModulo = 'todos';
        let filtroDisciplina = 'todos';
        let filtroStatus = 'todos';
        let busca = '';
        let videosFiltrados = [...VIDEOS];

        // =============================================
        // ELEMENTOS
        // =============================================
        const grid = document.getElementById('videoGrid');
        const filtroModuloEl = document.getElementById('filtroModulo');
        const filtroDisciplinaEl = document.getElementById('filtroDisciplina');
        const filtroStatusEl = document.getElementById('filtroStatus');
        const buscaEl = document.getElementById('buscaVideo');

        // =============================================
        // FUNÇÕES
        // =============================================
        function getDisciplinasUnicas() {
            const disciplinas = [...new Set(VIDEOS.map(v => v.disciplina))];
            return disciplinas.sort();
        }

        function popularDisciplinas() {
            const disciplinas = getDisciplinasUnicas();
            filtroDisciplinaEl.innerHTML = '<option value="todos">Todas as disciplinas</option>' +
                disciplinas.map(d => `<option value="${d}">${d}</option>`).join('');
        }

        function getStatusText(status) {
            const map = { 'disponivel': 'Disponível', 'aguardando': 'Aguardando liberação', 'assistido': 'Já assistido' };
            return map[status] || status;
        }

        function getStatusIcon(status) {
            const map = { 'disponivel': 'fa-check-circle', 'aguardando': 'fa-clock', 'assistido': 'fa-eye' };
            return map[status] || 'fa-circle';
        }

        function getEmojiModulo(modulo) {
            const map = { 'TI1': '1️⃣', 'TI2': '2️⃣', 'TI3': '3️⃣' };
            return map[modulo] || '📚';
        }

        function getCorModulo(modulo) {
            const map = { 'TI1': '#e3f2fd', 'TI2': '#e8f5e9', 'TI3': '#fff3e0' };
            return map[modulo] || '#f5f5f5';
        }

        function filtrarVideos() {
            videosFiltrados = VIDEOS.filter(v => {
                const matchModulo = filtroModulo === 'todos' || v.modulo === filtroModulo;
                const matchDisciplina = filtroDisciplina === 'todos' || v.disciplina === filtroDisciplina;
                const matchStatus = filtroStatus === 'todos' || v.status === filtroStatus;
                const matchBusca = busca === '' || 
                    v.titulo.toLowerCase().includes(busca.toLowerCase()) ||
                    v.professor.toLowerCase().includes(busca.toLowerCase());
                return matchModulo && matchDisciplina && matchStatus && matchBusca;
            });
            renderizar();
            atualizarStats();
        }

        function renderizar() {
            if (videosFiltrados.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-video-slash"></i>
                        <h3>Nenhum vídeo encontrado</h3>
                        <p>Tente ajustar os filtros ou a busca</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = videosFiltrados.map(v => `
                <div class="video-card" onclick="abrirVideo('${v.id}')">
                    <div class="video-thumb" style="background: ${getCorModulo(v.modulo)};">
                        <span class="modulo-tag">${getEmojiModulo(v.modulo)} ${v.modulo}</span>
                        <div class="play-icon"><i class="fas fa-play"></i></div>
                        <span class="duracao">${v.duracao}</span>
                    </div>
                    <div class="video-info">
                        <h3>${v.titulo}</h3>
                        <div class="meta">
                            <span><i class="fas fa-chalkboard-user"></i> ${v.professor}</span>
                            <span><i class="fas fa-calendar-alt"></i> ${v.data}</span>
                            <span><i class="fas fa-book"></i> ${v.disciplina}</span>
                        </div>
                        <span class="status ${v.status}"><i class="fas ${getStatusIcon(v.status)}"></i> ${getStatusText(v.status)}</span>
                    </div>
                </div>
            `).join('');
        }

        function atualizarStats() {
            document.getElementById('totalVideos').textContent = VIDEOS.length;
            document.getElementById('totalDisponiveis').textContent = VIDEOS.filter(v => v.status === 'disponivel').length;
            document.getElementById('totalAguardando').textContent = VIDEOS.filter(v => v.status === 'aguardando').length;
            document.getElementById('totalAssistidos').textContent = VIDEOS.filter(v => v.status === 'assistido').length;
        }

        function limparFiltros() {
            filtroModuloEl.value = 'todos';
            filtroDisciplinaEl.value = 'todos';
            filtroStatusEl.value = 'todos';
            buscaEl.value = '';
            filtroModulo = 'todos';
            filtroDisciplina = 'todos';
            filtroStatus = 'todos';
            busca = '';
            filtrarVideos();
            showNotification('Filtros limpos!', 'info');
        }

        function abrirVideo(id) {
            const video = VIDEOS.find(v => v.id === id);
            if (video) {
                showNotification(`🎬 Reproduzindo: ${video.titulo}`, 'info');
                // Simular marcação como assistido
                if (video.status === 'disponivel') {
                    video.status = 'assistido';
                    filtrarVideos();
                    showNotification('✅ Vídeo marcado como assistido!', 'success');
                }
            }
        }

        function showNotification(msg, tipo) {
            if (window.notificationSystem) {
                window.notificationSystem.show(msg, tipo);
            } else {
                alert(msg);
            }
        }

        // =============================================
        // EVENTOS
        // =============================================
        filtroModuloEl.addEventListener('change', () => {
            filtroModulo = filtroModuloEl.value;
            filtrarVideos();
        });

        filtroDisciplinaEl.addEventListener('change', () => {
            filtroDisciplina = filtroDisciplinaEl.value;
            filtrarVideos();
        });

        filtroStatusEl.addEventListener('change', () => {
            filtroStatus = filtroStatusEl.value;
            filtrarVideos();
        });

        buscaEl.addEventListener('input', () => {
            busca = buscaEl.value;
            filtrarVideos();
        });

        // =============================================
        // INICIALIZAR
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            popularDisciplinas();
            filtrarVideos();
        });

        // Substitua a função abrirVideo por esta:
function abrirVideo(id) {
    const video = VIDEOS.find(v => v.id === id);
    if (video) {
        // Salvar na sessionStorage para o player
        sessionStorage.setItem('video_playing', JSON.stringify(video));
        // Redirecionar para o player
        window.location.href = 'video_player.html';
    }
}
    </script>
</body>
</html>
