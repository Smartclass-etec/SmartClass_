<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoaulas - Aluno | SmartClass</title>
    <script src="js/theme-loader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/darkmode-padrao.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/darkmode-padrao.css">
    <link rel="stylesheet" href="css/sidebar.css">   <!-- NOVO -->
    <!-- ... -->
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#f0f2f5; display:flex; }
        
        .content { margin-left:260px; padding:25px; flex:1; background:#f0f2f5; min-height:100vh; }
        .page-header { margin-bottom:25px; }
        .page-header h1 { color:#00796b; font-size:28px; display:flex; align-items:center; gap:12px; }
        .page-header p { color:#666; font-size:14px; }
        
        .info-banner {
            background: linear-gradient(135deg, #e8f5e9, #c8e6d9);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid #4caf50;
        }
        .info-banner i { font-size:24px; color:#00796b; }
        .info-banner p { font-size:13px; color:#2d3436; }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .video-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #eef2f6;
            transition: all 0.3s ease;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,121,107,0.12);
        }
        
        .video-thumb {
            position: relative;
            background: #1a1a2e;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        
        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-thumb .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .video-thumb:hover .play-overlay {
            background: rgba(0,0,0,0.2);
        }
        
        .video-thumb .play-overlay i {
            font-size: 64px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        
        .video-thumb:hover .play-overlay i {
            transform: scale(1.1);
            color: #fbbf24;
        }
        
        .video-thumb .duracao {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.8);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: white;
            font-weight: 600;
        }
        
        .video-thumb .modulo-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,121,107,0.9);
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 11px;
            color: white;
            font-weight: 600;
        }
        
        .video-info { padding: 18px 20px; }
        .video-info h3 { font-size: 17px; color: #2d3436; font-weight:600; margin-bottom:5px; }
        .video-info .meta {
            font-size: 13px;
            color: #888;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .video-info .meta i { color:#00796b; width:18px; }
        
        .btn-assistir {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .btn-assistir:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,121,107,0.3);
        }
        
        .empty-state {
            text-align:center;
            padding:60px 20px;
            background:white;
            border-radius:20px;
            grid-column:1/-1;
            border:1px solid #eef2f6;
        }
        .empty-state i { font-size:64px; color:#ccc; margin-bottom:15px; }
        .empty-state h3 { color:#636e72; margin-bottom:8px; }
        .empty-state p { color:#b2bec3; font-size:14px; }
        
        /* DARK MODE */
        body.dark-mode .content { background:#0f172a; }
        body.dark-mode .video-card,
        body.dark-mode .empty-state { background:#1e293b; border-color:#334155; }
        body.dark-mode .page-header h1 { color:#fbbf24; }
        body.dark-mode .page-header p { color:#94a3b8; }
        body.dark-mode .video-info h3 { color:#f1f5f9; }
        body.dark-mode .video-info .meta { color:#94a3b8; }
        body.dark-mode .info-banner { background:#1e293b; border-left-color:#fbbf24; }
        body.dark-mode .info-banner p { color:#f1f5f9; }
        body.dark-mode .btn-assistir { background:linear-gradient(135deg,#0d4a47,#083a38); }
        body.dark-mode .btn-assistir:hover { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#0f172a; }
        
        @media (max-width:768px) {
            .content { margin-left:0; padding:15px; }
            .video-grid { grid-template-columns:1fr; max-width:100%; }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <h1><i class="fas fa-video"></i> Videoaulas Disponíveis</h1>
            <p>Assista às aulas que seus professores liberaram</p>
        </div>

        <div class="info-banner">
            <i class="fas fa-graduation-cap"></i>
            <p><strong>Aulas liberadas:</strong> Aqui você encontra todas as videoaulas que os professores disponibilizaram para sua turma.</p>
        </div>

        <div class="video-grid" id="videoGrid"></div>
    </div>

    <script src="js/sidebar.js"></script>
    <script>
        // =============================================
        // BUSCAR VÍDEOS LIBERADOS
        // =============================================
        function carregarVideosLiberados() {
            const todosVideos = JSON.parse(localStorage.getItem('videoaulas_professor') || '[]');
            const videosLiberados = todosVideos.filter(v => v.status === 'liberado');
            const grid = document.getElementById('videoGrid');

            if (videosLiberados.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-video-slash"></i>
                        <h3>Nenhuma videoaula disponível</h3>
                        <p>Aguardando os professores liberarem as aulas.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = videosLiberados.map(v => `
                <div class="video-card">
                    <div class="video-thumb" onclick="abrirVideo(${v.id})">
                        <img src="${v.thumb}" alt="${v.titulo}" onerror="this.src='https://placehold.co/600x400/1a1a2e/666?text=${encodeURIComponent(v.titulo)}'">
                        <div class="play-overlay">
                            <i class="fas fa-play-circle"></i>
                        </div>
                        <span class="modulo-tag">${v.modulo}</span>
                        <span class="duracao"><i class="fas fa-clock"></i> ${v.duracao}</span>
                    </div>
                    <div class="video-info">
                        <h3>${v.titulo}</h3>
                        <div class="meta">
                            <span><i class="fas fa-chalkboard-user"></i> ${v.professor}</span>
                            <span><i class="fas fa-calendar-alt"></i> ${v.data}</span>
                            <span><i class="fas fa-book"></i> ${v.disciplina}</span>
                        </div>
                        <button class="btn-assistir" onclick="abrirVideo(${v.id})">
                            <i class="fas fa-play"></i> Assistir Aula
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // =============================================
        // ABRIR VÍDEO
        // =============================================
        function abrirVideo(id) {
            const todosVideos = JSON.parse(localStorage.getItem('videoaulas_professor') || '[]');
            const video = todosVideos.find(v => v.id === id);
            if (!video) return;

            video.visualizacoes = (video.visualizacoes || 0) + 1;
            localStorage.setItem('videoaulas_professor', JSON.stringify(todosVideos));

            const embedUrl = `https://www.youtube.com/embed/${video.videoId}?autoplay=1&rel=0`;

            sessionStorage.setItem('video_playing', JSON.stringify({
                id: video.id,
                titulo: video.titulo,
                professor: video.professor,
                disciplina: video.disciplina,
                modulo: video.modulo,
                data: video.data,
                url: embedUrl
            }));
            sessionStorage.setItem('origem_video', window.location.pathname.split('/').pop());

            window.location.href = 'video_player.html';
        }

        // =============================================
        // INICIALIZAR
        // =============================================
        document.addEventListener('DOMContentLoaded', carregarVideosLiberados);

        window.abrirVideo = abrirVideo;
    </script>
</body>
</html>
