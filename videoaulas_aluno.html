<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoaulas - Aluno | SmartClass</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#f0f2f5; display:flex; }
        .content { margin-left:260px; padding:25px; flex:1; background:#f0f2f5; min-height:100vh; }
        .page-header { margin-bottom:30px; }
        .page-header h1 { color:#00796b; font-size:28px; display:flex; align-items:center; gap:12px; }
        .page-header p { color:#666; font-size:14px; }
        .video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
        .video-card { background:white; border-radius:20px; overflow:hidden; border:1px solid #eef2f6; transition:0.3s; cursor:pointer; }
        .video-card:hover { transform:translateY(-5px); box-shadow:0 15px 35px rgba(0,121,107,0.12); }
        .video-thumb { background:#1a1a2e; height:180px; display:flex; align-items:center; justify-content:center; color:white; font-size:60px; position:relative; }
        .video-thumb .play-icon { background:rgba(0,0,0,0.6); width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; }
        .video-info { padding:15px; }
        .video-info h3 { font-size:16px; color:#2d3436; }
        .video-info .meta { font-size:12px; color:#888; margin-top:5px; display:flex; gap:15px; flex-wrap:wrap; }
        .video-info .meta i { color:#00796b; }
        .video-info .status { display:inline-block; padding:2px 10px; border-radius:20px; font-size:10px; font-weight:600; margin-top:5px; }
        .status.disponivel { background:#e8f5e9; color:#2e7d32; }
        .status.aguardando { background:#fff3e0; color:#e65100; }
        .empty-state { text-align:center; padding:60px 20px; background:white; border-radius:20px; grid-column:1/-1; }
        .empty-state i { font-size:64px; color:#ccc; margin-bottom:15px; }
        .empty-state h3 { color:#636e72; margin-bottom:8px; }
        .empty-state p { color:#b2bec3; }
        @media (max-width:768px) { .content { margin-left:0; padding:15px; } }
    </style>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <h1><i class="fas fa-video"></i> Videoaulas</h1>
            <p>Assista às gravações das aulas liberadas pelos professores</p>
        </div>
        <div class="video-grid" id="videoGrid">
            <!-- Exemplo de vídeo liberado -->
            <div class="video-card">
                <div class="video-thumb"><div class="play-icon"><i class="fas fa-play"></i></div></div>
                <div class="video-info">
                    <h3>Programação Web I - Aula 12</h3>
                    <div class="meta"><span><i class="fas fa-calendar"></i> 15/06/2026</span><span><i class="fas fa-clock"></i> 45min</span><span><i class="fas fa-chalkboard-user"></i> Prof. Carlos</span></div>
                    <span class="status disponivel"><i class="fas fa-check-circle"></i> Disponível</span>
                </div>
            </div>
            <div class="video-card">
                <div class="video-thumb"><div class="play-icon"><i class="fas fa-play"></i></div></div>
                <div class="video-info">
                    <h3>Banco de Dados - Aula 08</h3>
                    <div class="meta"><span><i class="fas fa-calendar"></i> 12/06/2026</span><span><i class="fas fa-clock"></i> 50min</span><span><i class="fas fa-chalkboard-user"></i> Prof. Mariana</span></div>
                    <span class="status aguardando"><i class="fas fa-clock"></i> Aguardando liberação</span>
                </div>
            </div>
        </div>
    </div>
    <script src="js/sidebar.js"></script>
</body>
</html>
