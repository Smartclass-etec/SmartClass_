<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Professor - Login | SmartClass ETEC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0a2e25;
            position: relative;
        }

        /* FUNDO VERDE ESCURO */
        .dark-green-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, #0a2e25 0%, #051f18 100%);
        }

        .dark-green-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 30%, rgba(0,255,200,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255,217,102,0.05) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* BOLHAS MENORES SUBINDO */
        .bubble {
            position: absolute;
            bottom: -50px;
            border-radius: 50%;
            pointer-events: none;
            animation: riseBubble linear infinite;
            box-shadow: 0 0 10px rgba(0,255,200,0.2);
            z-index: -1;
        }

        @keyframes riseBubble {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-120vh) translateX(var(--moveX, 20px)) rotate(360deg);
                opacity: 0;
            }
        }

        /* CÍRCULOS DECORATIVOS DE FUNDO */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        .bg-circle-1 {
            width: 500px;
            height: 500px;
            top: -200px;
            left: -150px;
            background: radial-gradient(circle, rgba(0,255,200,0.08) 0%, transparent 70%);
        }

        .bg-circle-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -120px;
            background: radial-gradient(circle, rgba(255,217,102,0.06) 0%, transparent 70%);
        }

        .bg-circle-3 {
            width: 250px;
            height: 250px;
            top: 50%;
            left: 10%;
            background: radial-gradient(circle, rgba(0,255,200,0.05) 0%, transparent 70%);
        }

        /* BOTÃO VOLTAR */
        .btn-voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: none;
            border-radius: 30px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: white;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Poppins', sans-serif;
            width: auto;
            white-space: nowrap;
        }
        
        .btn-voltar:hover {
            background: #004d47;
            transform: translateX(-3px);
        }

        /* CONTAINER PRINCIPAL */
        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            position: relative;
            overflow: hidden;
            width: 950px;
            max-width: 95%;
            min-height: 580px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: row-reverse;
            z-index: 10;
        }

        /* FORMULÁRIO */
        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in-container {
            left: 0;
            z-index: 2;
        }

        form {
            background: white;
            display: flex;
            flex-direction: column;
            padding: 50px 50px;
            height: 100%;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #00796b;
            font-size: 32px;
        }

        form p.subtitle {
            font-size: 13px;
            color: #777;
            margin-bottom: 25px;
        }

        /* INPUTS */
        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00796b;
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border-radius: 30px;
            border: 1px solid #e0e0e0;
            background: #f8fefe;
            transition: 0.3s ease;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00796b;
            box-shadow: 0 0 0 3px rgba(0,121,107,0.1);
            background: #ffffff;
        }

        /* BOTÃO */
        button {
            border-radius: 30px;
            border: none;
            padding: 14px 50px;
            background: linear-gradient(135deg, #00796b, #004d47);
            color: white;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,121,107,0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #999;
            font-size: 12px;
            width: 100%;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
            margin: 0 10px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .social-icons i {
            background: #f1f1f1;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 18px;
            color: #5b6e8c;
        }

        .social-icons i:hover {
            background: #00796b;
            color: white;
            transform: translateY(-3px);
        }

        /* OVERLAY (LADO DA LOGO) */
        .overlay-container {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
            z-index: 100;
        }

        .overlay {
            background: linear-gradient(135deg, #005f56, #003d36);
            color: white;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        /* LOGO CENTRALIZADA */
        .overlay-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .overlay-logo img {
            max-width: 220px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }

        .overlay-logo img:hover {
            transform: scale(1.05);
        }

        .overlay-logo h2 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .overlay-logo p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: 5px;
        }

        .overlay-tag {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .overlay-text {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.85;
        }

        /* NOTIFICAÇÃO */
        .notification {
            position: fixed;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 9999;
            transition: 0.4s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            color: white;
            background: #e53935;
            font-family: 'Poppins', sans-serif;
            white-space: nowrap;
        }

        .notification.show {
            top: 80px;
        }

        .notification.success {
            background: linear-gradient(135deg, #00796b, #004d47);
        }

        /* LOADING SCREEN */
        #loading-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 61, 54, 0.98);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            color: white;
            font-size: 16px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #FFD966;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 95%;
            }
            
            .form-container, .overlay-container {
                width: 100%;
                position: relative;
            }
            
            .overlay-container {
                display: none;
            }
            
            .sign-in-container {
                position: relative;
            }
            
            form {
                padding: 40px 30px;
            }
            
            .notification {
                white-space: normal;
                text-align: center;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

<!-- FUNDO VERDE ESCURO -->
<div class="dark-green-bg">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
</div>

<!-- BOTÃO VOLTAR -->
<button class="btn-voltar" onclick="window.location.href='index.html'">
    <i class="fas fa-arrow-left"></i> Voltar
</button>

<!-- NOTIFICAÇÃO -->
<div id="notification" class="notification">
    Use e-mail @professor.cps.sp.gov.br
</div>

<div class="container">
    <!-- FORMULÁRIO DE LOGIN -->
    <div class="form-container sign-in-container">
        <form id="loginForm">
            <h1>Entrar</h1>
            <p class="subtitle">Acesse sua conta com e-mail institucional</p>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="nome.sobrenome123@professor.cps.sp.gov.br" id="loginEmail" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Senha" id="loginSenha" required>
            </div>

            <button type="submit">Entrar</button>

            <div class="divider">ou</div>

            <div class="social-icons">
                <i class="fab fa-google"></i>
                <i class="fab fa-microsoft"></i>
            </div>
        </form>
    </div>

    <!-- LADO DA LOGO -->
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel">
                <div class="overlay-logo">
                    <img src="png/logo.branca.png" alt="SmartClass Logo" onerror="this.src='https://placehold.co/200x80/ffffff/00796b?text=SmartClass'">
                    <h2>SmartClass</h2>
                    <p>Plataforma Educacional</p>
                    <div class="overlay-tag">
                        <i class="fas fa-school"></i> ETEC - Centro Paula Souza
                    </div>
                </div>
                <div class="overlay-text">
                    <i class="fas fa-chalkboard-user"></i> Área do Professor
                </div>
            </div>
        </div>
    </div>
</div>

<!-- LOADING SCREEN -->
<div id="loading-screen">
    <div class="loader"></div>
    <p>Entrando...</p>
</div>

<script>
    // CRIA BOLHAS MENORES
    function createBubbles() {
        const bubbleContainer = document.body;
        const colors = [
            'rgba(0,255,200,0.12)',
            'rgba(0,200,255,0.1)',
            'rgba(100,255,200,0.08)',
            'rgba(0,255,180,0.11)',
            'rgba(50,200,255,0.07)',
            'rgba(0,255,220,0.09)'
        ];
        
        const bubbleCount = 40;
        
        for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            // TAMANHOS MENORES (entre 15px e 50px)
            const size = Math.random() * 35 + 15;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            
            // POSIÇÃO HORIZONTAL ALEATÓRIA
            bubble.style.left = Math.random() * 100 + '%';
            
            // COR ALEATÓRIA
            bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            // DURAÇÃO DA ANIMAÇÃO
            const duration = Math.random() * 10 + 6;
            bubble.style.animationDuration = duration + 's';
            
            // DELAY ALEATÓRIO
            bubble.style.animationDelay = Math.random() * 15 + 's';
            
            // MOVIMENTO HORIZONTAL VARIADO
            const moveX = (Math.random() - 0.5) * 150;
            bubble.style.setProperty('--moveX', moveX + 'px');
            
            // BORDA (efeito de bolha)
            bubble.style.border = '1px solid rgba(255,255,255,0.25)';
            bubble.style.backdropFilter = 'blur(1px)';
            
            bubbleContainer.appendChild(bubble);
        }
    }
    
    function extrairNomeDoEmail(email) {
        // Extrai o nome antes do @ e pega a primeira parte antes do ponto
        let nomeParte = email.split('@')[0];
        let nome = nomeParte.split('.')[0];
        // Remove números do final se houver
        nome = nome.replace(/[0-9]/g, '');
        nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase();
        return nome;
    }

    function showNotification(message, isError = true) {
        const notification = document.getElementById("notification");
        notification.textContent = message;
        if (!isError) {
            notification.classList.add("success");
        } else {
            notification.classList.remove("success");
        }
        notification.classList.add("show");
        setTimeout(() => notification.classList.remove("show"), 3000);
    }

    const loginForm = document.getElementById('loginForm');
    const loadingScreen = document.getElementById("loading-screen");

    loginForm.addEventListener("submit", function(e){
        e.preventDefault();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginSenha').value;

        if(!email.endsWith("@professor.cps.sp.gov.br")){
            showNotification("Use um e-mail institucional @professor.cps.sp.gov.br");
            return;
        }
        
        if(password.length < 1){
            showNotification("Digite sua senha");
            return;
        }
        
        const nome = extrairNomeDoEmail(email);
        
        const loggedUser = {
            name: nome,
            email: email,
            password: password,
            tipo: "professor",
            loginTemporario: true
        };
        
        localStorage.setItem("loggedUser", JSON.stringify(loggedUser));
        localStorage.setItem("tipoUsuario", "professor");
        
        loadingScreen.style.display = "flex";
        setTimeout(()=>{ window.location.href = "home_professor.html"; }, 800);
    });

    createBubbles();
</script>
</body>
</html>
