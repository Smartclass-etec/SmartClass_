<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravações - Professor | SmartClass</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:#f0f2f5; display:flex; }
        .content { margin-left:260px; padding:25px; flex:1; background:#f0f2f5; min-height:100vh; }
        .page-header { margin-bottom:30px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
        .page-header h1 { color:#00796b; font-size:28px; display:flex; align-items:center; gap:12px; }
        .page-header p { color:#666; font-size:14px; }
        .btn-upload { background:linear-gradient(135deg,#00796b,#004d47); color:white; border:none; padding:12px 25px; border-radius:30px; cursor:pointer; font-weight:600; transition:0.3s; display:flex; align-items:center; gap:8px; }
        .btn-upload:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,121,107,0.3); }
        .video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; margin-top:20px; }
        .video-card { background:white; border-radius:20px; overflow:hidden; border:1px solid #eef2f6; transition:0.3s; }
        .video-card:hover { box-shadow:0 8px 25px rgba(0,121,107,0.08); }
        .video-thumb { background:#1a1a2e; height:180px; display:flex; align-items:center; justify-content:center; color:white; font-size:60px; position:relative; }
        .video-thumb .play-icon { background:rgba(0,0,0,0.6); width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; }
        .video-info { padding:15px; }
        .video-info h3 { font-size:16px; color:#2d3436; }
        .video-info .meta { font-size:12px; color:#888; margin-top:5px; display:flex; gap:15px; flex-wrap:wrap; }
        .video-info .meta i { color:#00796b; }
        .video-actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        .btn-toggle { border:none; padding:6px 14px; border-radius:20px; cursor:pointer; font-size:11px; font-weight:600; transition:0.2s; }
        .btn-toggle.disponivel { background:#e8f5e9; color:#2e7d32; }
        .btn-toggle.aguardando { background:#fff3e0; color:#e65100; }
        .btn-toggle:hover { opacity:0.8; }
        .btn-delete { background:#ffebee; color:#c62828; border:none; padding:6px 14px; border-radius:20px; cursor:pointer; font-size:11px; font-weight:600; }
        .btn-delete:hover { background:#c62828; color:white; }
        .empty-state { text-align:center; padding:60px 20px; background:white; border-radius:20px; grid-column:1/-1; }
        .empty-state i { font-size:64px; color:#ccc; margin-bottom:15px; }
        .empty-state h3 { color:#636e72; margin-bottom:8px; }
        .empty-state p { color:#b2bec3; }
        @media (max-width:768px) { .content { margin-left:0; padding:15px; } }
    </style>
</head>
<body>
    <div class="content">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-video"></i> Gravações</h1>
                <p>Gerencie as gravações automáticas e libere para os alunos</p>
            </div>
            <button class="btn-upload" onclick="alert('As gravações são feitas automaticamente pelo sistema.')"><i class="fas fa-sync-alt"></i> Sincronizar</button>
        </div>
        <div class="video-grid" id="videoGrid">
            <!-- Exemplo de gravação -->
            <div class="video-card">
                <div class="video-thumb"><div class="play-icon"><i class="fas fa-play"></i></div></div>
                <div class="video-info">
                    <h3>Programação Web I - Aula 12</h3>
                    <div class="meta"><span><i class="fas fa-calendar"></i> 15/06/2026</span><span><i class="fas fa-clock"></i> 45min</span><span><i class="fas fa-chalkboard-user"></i> Prof. Carlos</span></div>
                    <div class="video-actions">
                        <button class="btn-toggle disponivel" onclick="toggleLiberacao(this)"><i class="fas fa-check-circle"></i> Disponível</button>
                        <button class="btn-delete" onclick="alert('Excluir gravação?')"><i class="fas fa-trash"></i> Excluir</button>
                    </div>
                </div>
            </div>
            <div class="video-card">
                <div class="video-thumb"><div class="play-icon"><i class="fas fa-play"></i></div></div>
                <div class="video-info">
                    <h3>Banco de Dados - Aula 08</h3>
                    <div class="meta"><span><i class="fas fa-calendar"></i> 12/06/2026</span><span><i class="fas fa-clock"></i> 50min</span><span><i class="fas fa-chalkboard-user"></i> Prof. Mariana</span></div>
                    <div class="video-actions">
                        <button class="btn-toggle aguardando" onclick="toggleLiberacao(this)"><i class="fas fa-clock"></i> Aguardando</button>
                        <button class="btn-delete" onclick="alert('Excluir gravação?')"><i class="fas fa-trash"></i> Excluir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function toggleLiberacao(btn) {
            if (btn.classList.contains('disponivel')) {
                btn.classList.remove('disponivel');
                btn.classList.add('aguardando');
                btn.innerHTML = '<i class="fas fa-clock"></i> Aguardando';
                alert('Gravação ocultada dos alunos.');
            } else {
                btn.classList.remove('aguardando');
                btn.classList.add('disponivel');
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Disponível';
                alert('Gravação liberada para os alunos!');
            }
        }
    </script>
    <script src="js/sidebar.js"></script>
</body>
</html>
